<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="marge-haut.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Missions</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="page.css">
  <link rel="stylesheet" href="icones-profil.css">
  <link rel="stylesheet" href="missions.css">
</head>
<body>
  <!-- Icône : Lucide (licence ISC) -->
  <header class="barre-page">
    <a class="barre-page__retour" href="accueil.html" aria-label="Retour à l'accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
    </a>
    <h1 class="barre-page__titre">Missions</h1>
  </header>

  <main class="liste-bulles">
    <!-- Deux onglets : les missions quotidiennes et les jetons SSR -->
    <div class="onglets" role="tablist" aria-label="Missions">
      <button class="onglets__bouton" type="button" role="tab" aria-selected="true" aria-controls="panneau-quotidiennes" data-onglet="quotidiennes">Quotidiennes</button>
      <button class="onglets__bouton" type="button" role="tab" aria-selected="false" aria-controls="panneau-jetons" data-onglet="jetons">Jetons SSR</button>
    </div>

    <!-- Missions quotidiennes : barre de progression (et son Sceau bonus), puis les 3 missions (missions.js) -->
    <section class="bulle-page" id="panneau-quotidiennes" role="tabpanel" data-panneau="quotidiennes" aria-labelledby="titre-quotidiennes">
      <div class="missions-entete">
        <h2 class="bulle-page__titre" id="titre-quotidiennes">Missions quotidiennes</h2>
        <span class="missions-entete__sceaux" aria-label="Sceaux possédés">
          <img src="assets/icones/sceau.svg" alt=""><span data-sceaux></span>
        </span>
      </div>
      <p class="missions-renouvellement" data-renouvellement></p>

      <div class="progression">
        <div class="progression__piste" role="progressbar" aria-label="Missions accomplies aujourd'hui" aria-valuemin="0" aria-valuemax="3">
          <span class="progression__remplissage"></span>
          <span class="progression__cran" style="left: 33.33%"></span>
          <span class="progression__cran" style="left: 66.67%"></span>
          <span class="progression__texte" data-progression-texte></span>
        </div>
        <button class="progression__bonus" type="button" data-bonus aria-label="Sceau bonus">
          <img src="assets/icones/sceau.svg" alt="">
          <span class="progression__gain">+1</span>
        </button>
      </div>

      <ul class="liste-missions" data-liste-missions></ul>
      <p class="message-page" data-message role="status"></p>
    </section>

    <!-- Jetons SSR : chaque SSR obtenue débloque une icône de profil à son image (rempli par missions.js) -->
    <section class="bulle-page" id="panneau-jetons" role="tabpanel" data-panneau="jetons" aria-labelledby="titre-jetons" hidden>
      <div class="missions-entete">
        <h2 class="bulle-page__titre" id="titre-jetons">Jetons SSR</h2>
        <span class="jetons-compteur" data-jetons-compteur></span>
      </div>
      <p class="bulle-page__texte">Chaque carte SSR que tu obtiens débloque une icône de profil à son image, à choisir ensuite dans ton profil.</p>
      <div class="jetons-series" data-jetons></div>
      <p class="message-page" data-message-jetons role="status"></p>
    </section>
  </main>

  <script src="reglages.js"></script>
  <script src="sons.js"></script>
  <script src="musique.js"></script>
  <script src="compte.js"></script>
  <script src="sauvegarde.js"></script>
  <script src="sceaux.js"></script>
  <script src="missions-quotidiennes.js"></script>
  <script src="collection.js"></script>
  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/series.js"></script>
  <script src="jetons-ssr.js"></script>
  <script src="missions.js"></script>
</body>
</html>
