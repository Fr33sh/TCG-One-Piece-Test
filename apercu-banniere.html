<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aperçu des illustrations de la bannière Combat</title>
  <!-- Page TEMPORAIRE : illustrations candidates (affiches officielles, AniList), à supprimer après le choix -->
  <style>
    @font-face {
      font-family: "Lilita One";
      src: url("assets/polices/lilita-one.woff2") format("woff2");
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      padding: max(env(safe-area-inset-top), 24px) 12px 40px;
      background: radial-gradient(ellipse at 50% 30%, #e7d2a2 0%, #e0c48f 60%, #d5b47e 100%) fixed;
      color: #1f1610;
      font-family: "Lilita One", "Arial Black", sans-serif;
    }

    h1 {
      font-size: 22px;
      font-weight: 400;
      text-align: center;
    }

    .aide {
      margin: 6px 0 18px;
      color: #5b4a39;
      font-size: 14px;
      text-align: center;
    }

    .grille {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 12px;
    }

    figure {
      margin: 0;
    }

    /* Mini écran : la bande penchée de l'onglet Combat, à l'échelle */
    .ecran {
      position: relative;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border: 3px solid #0b0a09;
      border-radius: 14px;
      background: radial-gradient(ellipse at 50% 60%, #e7d2a2 0%, #e0c48f 60%, #d5b47e 100%);
      box-shadow: 0 0 0 2px #b8874d;
    }

    .bande {
      position: absolute;
      top: -8%;
      right: -14%;
      bottom: 14%;
      left: -14%;
      overflow: hidden;
      border-top: 4px solid #3aaef4;
      border-bottom: 4px solid #3aaef4;
      background: #1e8fe2;
      transform: rotate(-8deg);
    }

    .bande img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 20%;
    }

    .bande b {
      position: absolute;
      top: 19%;
      left: 15%;
      color: #fff8e1;
      font-size: 26px;
      font-weight: 400;
      line-height: 1;
      text-shadow: 0 2px 0 #0b0a09, 2px 0 0 #0b0a09, 0 -2px 0 #0b0a09, -2px 0 0 #0b0a09, 1px 1px 0 #0b0a09, -1px -1px 0 #0b0a09, 1px -1px 0 #0b0a09, -1px 1px 0 #0b0a09;
    }

    figcaption {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.15;
      text-align: center;
    }

    figcaption span {
      display: block;
      font-size: 18px;
      color: #8a5a2b;
    }
  </style>
</head>
<body>
  <h1>Bannière Combat : 12 illustrations</h1>
  <p class="aide">Réponds avec le numéro de ton choix.<br>Le cadrage pourra ensuite être ajusté.</p>
  <div class="grille"></div>

  <script>
    const A = "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/";
    const ILLUSTRATIONS = [
      ["Episode of East Blue", "bx99302-b40WIhc5dylo.jpg"],
      ["One Piece, le film (2000)", "bx459-Ivw65mUXackh.png"],
      ["L'Aventure de l'île de l'horloge", "bx460-p9HObfGUhWn0.jpg"],
      ["Le Pirate Ganzack (1998)", "nx466-bVP54I7dCB2F.jpg"],
      ["L'Aventure sans issue", "bx462-Ig8zfdsFWcql.png"],
      ["Episode of Merry", "nx19123-leET1CrSJknT.jpg"],
      ["Strong World", "bx4155-P5TDf6t6qFwX.png"],
      ["Film Z", "bx12859-uQFENDPzMWz6.jpg"],
      ["Gold", "nx21335-XsXdE0AeOkkZ.jpg"],
      ["Stampede", "bx105143-5uBDmhvMr6At.png"],
      ["Red", "bx141902-fTyoTk8F8qOl.jpg"],
      ["One Piece (série)", "bx21-ELSYx3yMPcKM.jpg"],
    ];

    const grille = document.querySelector(".grille");
    ILLUSTRATIONS.forEach(([nom, fichier], index) => {
      const figure = document.createElement("figure");
      figure.innerHTML = `
        <div class="ecran"><div class="bande"><img src="${A}${fichier}" alt=""><b>Combat</b></div></div>
        <figcaption><span>${index + 1}</span>${nom}</figcaption>`;
      grille.append(figure);
    });
  </script>
</body>
</html>
