<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Collection Naruto : nouvelles illustrations</title>
  <!-- Page TEMPORAIRE : 3 nouvelles illustrations candidates (C, D, E) pour les personnages principaux refusés
       (images officielles de l'anime, MyAnimeList), au format des cartes. À supprimer après le choix. -->
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { padding: max(env(safe-area-inset-top), 24px) 14px 40px; background: var(--fond-eclaire) fixed; color: var(--texte); font-family: var(--police-texte); }
    h1 { font: 400 24px var(--police-titre); text-align: center; }
    .aide { margin: 6px auto 18px; max-width: 460px; color: var(--texte-doux); font-size: 14px; line-height: 1.4; text-align: center; }
    .liste { display: flex; flex-direction: column; gap: 14px; max-width: 520px; margin: 0 auto; }
    .perso { padding: 12px; border: 1px solid var(--bord); border-radius: 18px; background: var(--surface); }
    .perso h2 { display: flex; gap: 8px; align-items: baseline; font: 400 19px var(--police-titre); }
    .rarete { margin-left: auto; padding: 3px 9px; border-radius: 999px; font: 700 12px var(--police-texte); letter-spacing: 0.08em; }
    .r1 { background: #3a3c44; } .r2 { background: #2f6fd1; } .r4 { background: linear-gradient(90deg, #ff7eb6, #fff07a, #7cc8ff); color: var(--encre); }
    .choix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    figure { position: relative; }
    .cadre { aspect-ratio: 1260 / 1760; overflow: hidden; border: 2px solid var(--bord-clair); border-radius: 10px; background: #000; }
    .cadre img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
    figcaption { position: absolute; top: 5px; left: 5px; padding: 2px 8px; border-radius: 999px; background: rgb(0 0 0 / 70%); font: 400 14px var(--police-titre); }
  </style>
</head>
<body>
  <h1>Naruto : nouvelles illustrations</h1>
  <p class="aide">3 nouvelles images pour chaque personnage refusé. Réponds par exemple « Kakashi D, Sakura C… »
    (ou « aucune »).</p>
  <div class="liste"></div>

  <script>
    const LETTRES = { 1: "A", 2: "S", 3: "SR", 4: "SSR" };
    const PERSONNAGES = [
      ["Kakashi Hatake", 4, "85"],
      ["Sakura Haruno", 2, "145"],
      ["Iruka Umino", 2, "2011"],
      ["Ino Yamanaka", 1, "2009"],
      ["Shikamaru Nara", 1, "2007"],
    ];
    document.querySelector(".liste").append(...PERSONNAGES.map(([nom, rang, id]) => {
      const bloc = document.createElement("section");
      bloc.className = "perso";
      bloc.innerHTML = `
        <h2>${nom}<span class="rarete r${rang}">${LETTRES[rang]}</span></h2>
        <div class="choix">
          ${["C", "D", "E"].map(l => `<figure><div class="cadre"><img src="assets/naruto/candidats2/${id}-${l}.jpg" alt=""></div><figcaption>${l}</figcaption></figure>`).join("")}
        </div>`;
      return bloc;
    }));
  </script>
</body>
</html>
