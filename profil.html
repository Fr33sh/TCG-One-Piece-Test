<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profil</title>
  <link rel="stylesheet" href="page.css">
  <link rel="stylesheet" href="profil.css">
</head>
<body>
  <!-- Icône : Lucide (licence ISC) -->
  <header class="barre-page">
    <a class="barre-page__retour" href="accueil.html" aria-label="Retour à l'accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
    </a>
    <h1 class="barre-page__titre">Profil</h1>
  </header>

  <main class="liste-bulles">
    <section class="bulle-page" aria-labelledby="titre-profil">
      <h2 class="bulle-page__titre" id="titre-profil">Mon profil</h2>
      <p class="identifiant" data-identifiant></p>
      <p class="bulle-page__texte" data-texte-profil></p>
      <form class="formulaire-ligne" data-formulaire="pseudo">
        <input class="champ" name="pseudo" maxlength="16" autocomplete="nickname" placeholder="Nouveau pseudo" aria-label="Nouveau pseudo" required>
        <button class="petite-bulle petite-bulle--principale" type="submit">Changer</button>
      </form>
      <p class="message-page" data-message="pseudo" role="status"></p>
    </section>

    <!-- Compte non lié : proposer Discord -->
    <section class="bulle-page" data-vue="sans-lien" hidden aria-labelledby="titre-discord">
      <h2 class="bulle-page__titre" id="titre-discord">Compte Discord</h2>
      <p class="bulle-page__texte">Ton compte n'est pas lié : ta progression n'est enregistrée que sur cet appareil et tu ne peux pas ajouter d'amis. Lie ton compte Discord pour la sauvegarder en ligne.</p>
      <button class="bouton-discord" type="button" data-lier-discord>Lier mon compte Discord</button>
      <p class="message-page message-page--erreur" data-message="discord" role="status"></p>
    </section>
  </main>

  <script src="reglages.js"></script>
  <script src="sons.js"></script>
  <script src="musique.js"></script>
  <script src="compte.js"></script>
  <script src="sauvegarde.js"></script>
  <script src="profil.js"></script>
</body>
</html>
