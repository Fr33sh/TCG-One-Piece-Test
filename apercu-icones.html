<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aperçu des icônes de profil</title>
  <!-- Page TEMPORAIRE : candidats pour les icônes « Icône de Base », à supprimer une fois le choix fait -->
  <style>
    @font-face {
      font-family: "Lilita One";
      src: url("assets/polices/lilita-one.woff2") format("woff2");
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      padding: max(env(safe-area-inset-top), 24px) 16px 40px;
      background: radial-gradient(ellipse at 50% 30%, #e7d2a2 0%, #e0c48f 60%, #d5b47e 100%) fixed;
      color: #1f1610;
      font-family: "Lilita One", "Arial Black", sans-serif;
    }

    h1 {
      font-size: 26px;
      font-weight: 400;
      text-align: center;
    }

    .aide {
      margin-top: 6px;
      color: #5b4a39;
      font-size: 14px;
      text-align: center;
    }

    h2 {
      margin: 26px 0 12px;
      font-size: 21px;
      font-weight: 400;
    }

    .grille {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 10px;
    }

    figure {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      margin: 0;
      text-align: center;
    }

    /* Même jeton que dans le jeu : rond, contour noir, filet doré */
    .jeton {
      width: 88px;
      height: 88px;
      overflow: hidden;
      border: 3px solid #0b0a09;
      border-radius: 50%;
      background: #f1e2bd;
      box-shadow: 0 0 0 2px #b8874d, 0 4px 10px rgb(60 35 10 / 35%);
    }

    .jeton img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    figcaption {
      font-size: 13px;
      line-height: 1.15;
    }

    figcaption b {
      display: block;
      font-size: 17px;
      font-weight: 400;
      color: #8a5a2b;
    }
  </style>
</head>
<body>
  <h1>Icônes de Base : les candidats</h1>
  <p class="aide">Réponds avec un code pour chaque camp (ex. M2 et P4).<br>Le cadrage pourra ensuite être ajusté.</p>

  <h2>Soldat de la Marine</h2>
  <div class="grille" data-camp="M"></div>

  <h2>Pirate</h2>
  <div class="grille" data-camp="P"></div>

  <script>
    // [nom, image, cadrage (point de l'image gardé au centre), zoom]
    const CANDIDATS = {
      M: [
        ["Soldat (Fan Letter, aîné)", "assets/icones-profil/marine-soldat-ani.png", "50% 22%", 1],
        ["Soldat (Fan Letter, cadet)", "assets/icones-profil/marine-soldat-otouto.png", "50% 22%", 1],
        ["Koby", "assets/illustrations/EB-028.jpg", "50% 30%", 1],
        ["Hermep", "assets/illustrations/EB-018.jpg", "50% 30%", 1],
        ["Ripper", "assets/illustrations/EB-019.jpg", "50% 36%", 1],
        ["Nezumi", "assets/illustrations/EB-020.jpg", "50% 25%", 1],
      ],
      P: [
        ["Heppoko", "assets/illustrations/EB-021-heppoko.jpg", "50% 30%", 1],
        ["Peppoko", "assets/illustrations/EB-021-peppoko.jpg", "50% 30%", 1],
        ["Poppoko", "assets/illustrations/EB-021-poppoko.jpg", "50% 30%", 1],
        ["Yosaku", "assets/illustrations/EB-024-yosaku.jpg", "50% 30%", 1],
        ["Johnny", "assets/illustrations/EB-024-johnny.jpg", "50% 30%", 1],
        ["Cabaji", "assets/illustrations/EB-037.jpg", "50% 24%", 1],
        ["Higuma", "assets/illustrations/EB-034.jpg", "50% 18%", 1],
        ["Gin", "assets/illustrations/EB-051.jpg", "50% 0%", 1],
        ["Jango", "assets/illustrations/EB-038.webp", "50% 0%", 1],
      ],
    };

    for (const grille of document.querySelectorAll("[data-camp]")) {
      const camp = grille.dataset.camp;
      CANDIDATS[camp].forEach(([nom, image, cadrage], index) => {
        const figure = document.createElement("figure");
        figure.innerHTML = `
          <span class="jeton"><img src="${image}" alt="" style="object-position: ${cadrage}"></span>
          <figcaption><b>${camp}${index + 1}</b>${nom}</figcaption>`;
        grille.append(figure);
      });
    }
  </script>
</body>
</html>
