<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TCG One Piece</title>
  <!-- Ajout à l'écran d'accueil du téléphone : le jeu s'ouvre alors en plein écran, comme une application -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0a09">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TCG One Piece">
  <!-- La page passe sous la barre d'état (heure, batterie) : la marge du haut est gérée plus bas -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* Affiche le jeu dans un téléphone de 390 × 844 points, réduit si la fenêtre est trop petite. */
    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #2a2f38 0%, #14171c 70%);
    }

    body {
      display: grid;
      place-items: center;
    }

    .telephone {
      --echelle: 1;

      position: relative;
      flex: none;
      width: 418px;
      height: 872px;
      padding: 14px;
      border-radius: 60px;
      background: #0d0d0f;
      box-shadow:
        0 0 0 2px #3a3d44,
        0 0 0 6px #1b1d21,
        0 30px 80px rgb(0 0 0 / 60%);
      transform: scale(var(--echelle));
    }

    .telephone__ecran {
      display: block;
      width: 390px;
      height: 844px;
      overflow: hidden;
      border: 0;
      border-radius: 46px;
      background: #000;
    }

    /* Encoche de la caméra, posée par-dessus l'écran */
    .telephone__camera {
      position: absolute;
      top: 25px;
      left: 50%;
      width: 120px;
      height: 34px;
      border-radius: 20px;
      background: #000;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* Sur un vrai téléphone : le jeu occupe tout l'écran, sans le cadre du téléphone. Sous la barre d'état
       (heure, batterie), une bande sombre de la couleur du cadre du jeu, au lieu d'une bande blanche. */
    @media (max-width: 500px) {
      html,
      body {
        background: #0b0a09;
      }

      .telephone {
        width: 100%;
        height: 100%;
        padding: env(safe-area-inset-top) 0 0;
        border-radius: 0;
        background: #0b0a09;
        box-shadow: none;
        transform: none;
      }

      .telephone__ecran {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }

      .telephone__camera {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="telephone">
    <iframe class="telephone__ecran" src="chargement.html" title="Jeu"></iframe>
    <span class="telephone__camera" aria-hidden="true"></span>
  </div>

  <script>
    // Réduit le téléphone pour qu'il tienne entièrement dans la fenêtre
    const telephone = document.querySelector(".telephone");
    function ajusterEchelle() {
      const echelle = Math.min(1, (window.innerHeight - 40) / 872, (window.innerWidth - 40) / 418);
      telephone.style.setProperty("--echelle", echelle);
    }
    ajusterEchelle();
    window.addEventListener("resize", ajusterEchelle);

    // Retour de Discord (« #discord-… ») : le jeu reprend sur l'écran de création du compte
    if (location.hash.startsWith("#discord-")) {
      document.querySelector(".telephone__ecran").src = "connexion.html" + location.hash;
      history.replaceState(null, "", location.pathname);
    }
  </script>

  <!-- La musique est jouée ici : cette page reste ouverte quand le jeu change d'onglet -->
  <script src="reglages.js"></script>
  <script src="sons.js"></script>
  <script src="musique.js"></script>
</body>
</html>
