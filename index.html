<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TCG One Piece</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="accueil" role="img" aria-label="Cartes éparpillées devant un paysage de mer et d'îles">
    <!-- Cartes neutres provisoires : --x et --y placent le centre de la carte, --r la fait pivoter -->
    <div class="carte" style="--x: 15%; --y: 22%; --r: -14deg"><div class="carte__entete"></div><div class="carte__image"></div><div class="carte__texte"></div></div>
    <div class="carte" style="--x: 50%; --y: 16%; --r: 6deg"><div class="carte__entete"></div><div class="carte__image"></div><div class="carte__texte"></div></div>
    <div class="carte" style="--x: 85%; --y: 25%; --r: 13deg"><div class="carte__entete"></div><div class="carte__image"></div><div class="carte__texte"></div></div>
    <div class="carte" style="--x: 30%; --y: 50%; --r: 9deg"><div class="carte__entete"></div><div class="carte__image"></div><div class="carte__texte"></div></div>
    <div class="carte" style="--x: 72%; --y: 54%; --r: -10deg"><div class="carte__entete"></div><div class="carte__image"></div><div class="carte__texte"></div></div>
    <div class="carte" style="--x: 17%; --y: 79%; --r: -7deg"><div class="carte__entete"></div><div class="carte__image"></div><div class="carte__texte"></div></div>
    <div class="carte" style="--x: 52%; --y: 82%; --r: 4deg"><div class="carte__entete"></div><div class="carte__image"></div><div class="carte__texte"></div></div>
    <div class="carte" style="--x: 86%; --y: 78%; --r: 12deg"><div class="carte__entete"></div><div class="carte__image"></div><div class="carte__texte"></div></div>
  </main>
</body>
</html>
