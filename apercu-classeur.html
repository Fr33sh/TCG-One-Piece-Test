<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Couvertures de classeur (aperçu temporaire)</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Page d'aperçu temporaire : 10 propositions de couverture pour les classeurs, toutes avec notre logo */
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px 60px;
      background: var(--fond-eclaire, #0b0b0d) fixed;
      color: var(--texte);
      font-family: var(--police-texte);
    }

    h1 {
      margin: 0 0 6px;
      font: 400 26px / 1.1 var(--police-titre);
      text-align: center;
    }

    .aide {
      margin: 0 0 24px;
      color: var(--texte-doux);
      font-size: 14px;
      text-align: center;
    }

    .grille {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 170px));
      justify-content: center;
      gap: 26px 18px;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    figcaption {
      margin-top: 10px;
      font: 400 16px / 1.15 var(--police-titre);
    }

    figcaption small {
      display: block;
      margin-top: 4px;
      color: var(--texte-faible);
      font: 700 11px / 1.3 var(--police-texte);
    }

    /* Base commune : un classeur 3/4 avec reliure à gauche */
    .couv {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 6px 12px 12px 6px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgb(0 0 0 / 50%);
    }

    .couv img {
      position: relative;
      z-index: 2;
      width: 58%;
    }

    .reliure {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 3;
      width: 13%;
    }

    /* 1. Cuir noir à anneaux prisma */
    .c1 {
      border: 1px solid #3a3a42;
      background: radial-gradient(circle at 60% 40%, #26262e, #0b0b0d 78%);
    }
    .c1 .reliure {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      border-right: 1px solid #3a3a42;
      background: linear-gradient(90deg, #050506, #18181d);
    }
    .c1 .reliure i {
      width: 52%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--prisma-conique);
    }
    .c1 img { margin-left: 13%; }

    /* 2. Surpiqûre blanche */
    .c2 {
      background: linear-gradient(160deg, #1c1c22, #09090b);
    }
    .c2::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px dashed rgb(255 255 255 / 55%);
      border-radius: 4px 8px 8px 4px;
    }
    .c2 .reliure {
      width: 9%;
      background: linear-gradient(90deg, #000, #222228 60%, #000);
    }

    /* 3. Blanc épuré, médaillon noir (rappelle le dos des cartes) */
    .c3 {
      background: linear-gradient(160deg, #ffffff, #e9e9ee);
    }
    .c3 .reliure {
      width: 10%;
      background: #111114;
    }
    .c3 .medaillon {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 66%;
      aspect-ratio: 1;
      margin-left: 10%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #2a2a32, #0b0b0d);
      box-shadow: 0 6px 14px rgb(0 0 0 / 30%);
    }
    .c3 .medaillon img { width: 78%; }

    /* 4. Bande prisma en diagonale */
    .c4 {
      background: #0b0b0d;
    }
    .c4::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: linear-gradient(115deg, transparent 40%, #ff7eb6 40%, #ffb86b 44%, #fff07a 48%, #7dffc4 52%, #7cc8ff 56%, #b98cff 60%, transparent 60%);
      opacity: 0.85;
    }
    .c4 img {
      padding: 6%;
      border-radius: 50%;
      background: #0b0b0d;
      box-shadow: 0 0 0 4px #0b0b0d;
    }

    /* 5. Facettes de cristal */
    .c5 {
      background:
        conic-gradient(from 30deg at 30% 25%, #1b1b21 0 25%, #121216 0 50%, #202027 0 75%, #0e0e11 0),
        #111;
    }
    .c5::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(60deg, transparent 49.5%, rgb(255 255 255 / 10%) 50%, transparent 50.5%),
        linear-gradient(-60deg, transparent 49.5%, rgb(255 255 255 / 10%) 50%, transparent 50.5%),
        linear-gradient(0deg, transparent 49.5%, rgb(255 255 255 / 8%) 50%, transparent 50.5%);
      background-size: 60px 52px;
    }
    .c5::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgb(255 255 255 / 12%), transparent 40%, transparent 70%, rgb(124 200 255 / 14%));
    }

    /* 6. Porte-étiquette blanc */
    .c6 {
      background: linear-gradient(160deg, #1d1d23, #0a0a0c);
    }
    .c6 .etiquette {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 66%;
      padding: 12px 0 10px;
      border: 3px solid #c9c9d2;
      border-radius: 10px;
      background: #f6f6f8;
      box-shadow: inset 0 2px 6px rgb(0 0 0 / 25%);
    }
    .c6 .etiquette .rond {
      display: grid;
      place-items: center;
      width: 62%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #0b0b0d;
    }
    .c6 .etiquette img { width: 82%; }
    .c6 .etiquette span {
      color: #0b0b0d;
      font: 400 13px / 1 var(--police-titre);
      letter-spacing: 0.14em;
    }

    /* 7. Coins argentés */
    .c7 {
      background: radial-gradient(circle at 50% 45%, #22222a, #09090b 80%);
    }
    .c7 .coin {
      position: absolute;
      z-index: 2;
      width: 22%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #f4f4f7, #9a9aa6 55%, #d8d8e0);
    }
    .c7 .coin--hd { top: 0; right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%); }
    .c7 .coin--bd { right: 0; bottom: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
    .c7 .coin--hg { top: 0; left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
    .c7 .coin--bg { bottom: 0; left: 0; clip-path: polygon(0 0, 100% 100%, 0 100%); }

    /* 8. Halo irisé derrière le logo */
    .c8 {
      background: #08080a;
    }
    .c8::before {
      content: "";
      position: absolute;
      width: 95%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--prisma-conique);
      filter: blur(26px);
      opacity: 0.45;
    }

    /* 9. Grand kanji en filigrane */
    .c9 {
      background: linear-gradient(170deg, #17171c, #070709);
    }
    .c9 .filigrane {
      position: absolute;
      right: -30%;
      bottom: -18%;
      z-index: 1;
      width: 130%;
      opacity: 0.08;
    }
    .c9 img:not(.filigrane) {
      width: 44%;
      margin: -30% 22% 0 0;
    }

    /* 10. Holographique : reflet irisé et éclat blanc */
    .c10 {
      background:
        linear-gradient(125deg, rgb(255 126 182 / 22%), rgb(255 240 122 / 18%) 30%, rgb(125 255 196 / 18%) 55%, rgb(124 200 255 / 22%) 78%, rgb(185 140 255 / 25%)),
        #0d0d10;
      border: 1px solid rgb(255 255 255 / 25%);
    }
    .c10::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: linear-gradient(120deg, transparent 35%, rgb(255 255 255 / 28%) 45%, transparent 55%);
    }
  </style>
</head>
<body>
  <h1>Couvertures de classeur</h1>
  <p class="aide">Aperçu temporaire : dis-moi le numéro qui te plaît.</p>

  <div class="grille">
    <figure>
      <div class="couv c1"><span class="reliure"><i></i><i></i><i></i></span><img src="assets/logo/anima.svg" alt=""></div>
      <figcaption>1. Anneaux prisma<small>Cuir noir, reliure à 3 anneaux irisés</small></figcaption>
    </figure>

    <figure>
      <div class="couv c2"><span class="reliure"></span><img src="assets/logo/anima.svg" alt=""></div>
      <figcaption>2. Surpiqûre<small>Noir, couture blanche tout autour</small></figcaption>
    </figure>

    <figure>
      <div class="couv c3"><span class="reliure"></span><span class="medaillon"><img src="assets/logo/anima.svg" alt=""></span></div>
      <figcaption>3. Blanc épuré<small>Couverture blanche, médaillon noir</small></figcaption>
    </figure>

    <figure>
      <div class="couv c4"><img src="assets/logo/anima.svg" alt=""></div>
      <figcaption>4. Bande prisma<small>Noir traversé d'une bande arc-en-ciel</small></figcaption>
    </figure>

    <figure>
      <div class="couv c5"><img src="assets/logo/anima.svg" alt=""></div>
      <figcaption>5. Cristal<small>Facettes sombres et reflets</small></figcaption>
    </figure>

    <figure>
      <div class="couv c6"><span class="etiquette"><span class="rond"><img src="assets/logo/anima-symbole.svg" alt=""></span><span>CLASSEUR</span></span></div>
      <figcaption>6. Étiquette<small>Porte-étiquette blanc sur noir</small></figcaption>
    </figure>

    <figure>
      <div class="couv c7"><span class="coin coin--hg"></span><span class="coin coin--hd"></span><span class="coin coin--bg"></span><span class="coin coin--bd"></span><img src="assets/logo/anima.svg" alt=""></div>
      <figcaption>7. Coins argentés<small>Noir, quatre coins en métal</small></figcaption>
    </figure>

    <figure>
      <div class="couv c8"><img src="assets/logo/anima.svg" alt=""></div>
      <figcaption>8. Halo irisé<small>Lueur prisma derrière le logo</small></figcaption>
    </figure>

    <figure>
      <div class="couv c9"><img class="filigrane" src="assets/logo/anima-symbole.svg" alt=""><img src="assets/logo/anima.svg" alt=""></div>
      <figcaption>9. Filigrane<small>Grand 魂 en fond, logo en haut</small></figcaption>
    </figure>

    <figure>
      <div class="couv c10"><img src="assets/logo/anima.svg" alt=""></div>
      <figcaption>10. Holographique<small>Fond irisé avec éclat de lumière</small></figcaption>
    </figure>
  </div>
</body>
</html>
