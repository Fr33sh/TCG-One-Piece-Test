<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="marge-haut.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paramètres</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="page.css">
  <link rel="stylesheet" href="parametres.css">
</head>
<body>
  <!-- Icônes : Lucide (licence ISC) -->
  <header class="barre-page">
    <a class="barre-page__retour" href="accueil.html" aria-label="Retour à l'accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
    </a>
    <h1 class="barre-page__titre">Paramètres</h1>
  </header>

  <!-- Une bulle par paramètre, les unes sous les autres ; la page défile de haut en bas -->
  <main class="liste-bulles">
    <section class="bulle-page" aria-labelledby="titre-audio">
      <h2 class="bulle-page__titre" id="titre-audio">Audio</h2>
      <!-- Musique et effets sonores : remplis par parametres.js -->
      <div class="parametre__reglages" data-reglages="audio"></div>
      <button class="petite-bulle bouton-reinitialiser" type="button" data-reinitialiser="audio">Réinitialiser ce paramètre</button>
    </section>

    <!-- Mode test TEMPORAIRE (parametres-test.js) : à retirer avant de partager le jeu -->
    <section class="bulle-page" aria-labelledby="titre-test">
      <h2 class="bulle-page__titre" id="titre-test">Mode test</h2>
      <p class="bulle-page__texte">Outils temporaires pour tester le jeu, valables sur cet appareil.</p>
      <div class="reglage-son">
        <div class="reglage-son__haut">
          <span class="reglage-son__nom" id="nom-illimite">Boosters illimités</span>
          <button class="interrupteur" type="button" role="switch" aria-labelledby="nom-illimite" data-mode-test>
            <span class="interrupteur__pastille"></span>
          </button>
        </div>
      </div>
      <button class="petite-bulle petite-bulle--principale" type="button" data-toutes-cartes>Recevoir toutes les cartes</button>
      <button class="petite-bulle" type="button" data-test-z>Prochain booster avec une Z</button>
      <p class="message-page" role="status" data-message="test"></p>
    </section>
  </main>

  <script src="reglages.js"></script>
  <script src="sons.js"></script>
  <script src="musique.js"></script>
  <script src="compte.js"></script>
  <script src="sauvegarde.js"></script>
  <script src="parametres.js"></script>
  <script src="collection.js"></script>
  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="mode-test.js"></script>
  <script src="parametres-test.js"></script>
</body>
</html>
