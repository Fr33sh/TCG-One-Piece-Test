<!doctype html>
<html lang="fr" class="sans-barre-defilement">
<head>
  <meta charset="utf-8">
  <script src="marge-haut.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Collection</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <link rel="stylesheet" href="cartes.css">
  <link rel="stylesheet" href="navigation.css">
</head>
<body class="avec-navigation">
  <header class="barre-collection">
    <!-- Icône : Lucide (licence ISC) -->
    <button class="barre-collection__retour" type="button" aria-label="Revenir aux séries" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
    </button>
    <h1 class="barre-collection__titre">Collection</h1>
    <span class="solde barre-collection__solde" role="status" aria-label="Animas possédés">
      <img src="assets/monnaie/anima.svg" alt=""><span data-animas>0</span>
    </span>
  </header>

  <main>
    <!-- Deux onglets : les cartes, série par série, et les classeurs du joueur (classeurs-page.js) -->
    <div class="onglets onglets--collection" role="tablist" aria-label="Collection">
      <button class="onglets__bouton" type="button" role="tab" aria-selected="true" data-onglet="cartes">Cartes</button>
      <button class="onglets__bouton" type="button" role="tab" aria-selected="false" data-onglet="classeurs">Classeurs</button>
    </div>

    <div data-panneau="cartes">
      <!-- Séries : un onglet par série, avec son illustration (rempli par cartes.js depuis donnees/series.js) -->
      <section class="series"></section>

      <!-- Cartes de la série : celles pas encore obtenues sont des cases vides numérotées -->
      <section class="apercu__grille" hidden></section>
    </div>

    <!-- Classeurs : la liste, un classeur ouvert (ses 20 places), ou le choix de ses cartes (classeurs-page.js) -->
    <div data-panneau="classeurs" hidden>
      <section class="classeurs" data-vue-classeurs="liste"></section>

      <section class="classeur" data-vue-classeurs="ouvert" hidden>
        <div class="classeur__entete">
          <button class="petite-bulle-sombre" type="button" data-classeur-retour>← Mes classeurs</button>
          <span class="classeur__compte" data-classeur-compte></span>
        </div>
        <h2 class="classeur__nom" data-classeur-nom></h2>
        <div class="classeur__actions">
          <button class="bouton-blanc" type="button" data-classeur-modifier>Choisir les cartes</button>
          <button class="petite-bulle-sombre" type="button" data-classeur-renommer>Renommer</button>
          <button class="petite-bulle-sombre petite-bulle-sombre--danger" type="button" data-classeur-supprimer>Supprimer</button>
        </div>
        <div class="apercu__grille classeur__grille" data-classeur-grille></div>
      </section>

      <section class="selection" data-vue-classeurs="selection" hidden>
        <p class="selection__aide">Touche les cartes à mettre dans le classeur (20 au plus). Seules les cartes que tu possèdes sont proposées.</p>
        <div data-selection-cartes></div>
        <div class="selection__barre">
          <span data-selection-compte></span>
          <button class="bouton-blanc" type="button" data-selection-terminer>Terminer</button>
        </div>
      </section>
    </div>
  </main>
  <nav class="navigation navigation--fixe" data-actif="collection"></nav>

  <!-- Carte agrandie : la toucher la retourne, la flèche ramène à la collection -->
  <div class="zoom" hidden>
    <div class="zoom__fond"></div>
    <!-- Icône : Lucide (licence ISC) -->
    <button class="zoom__retour" type="button" aria-label="Revenir à la collection">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
    </button>
    <!-- Recyclage des doublons de la carte agrandie (rempli par cartes.js) : on en garde toujours un -->
    <div class="recyclage" hidden>
      <p class="recyclage__info" data-recyclage-info></p>
      <div class="recyclage__ligne" data-recyclage-choix>
        <div class="recyclage__quantite">
          <button class="recyclage__pas" type="button" data-recyclage-pas="-1" aria-label="Un doublon de moins">−</button>
          <span class="recyclage__nombre" data-recyclage-nombre>1</span>
          <button class="recyclage__pas" type="button" data-recyclage-pas="1" aria-label="Un doublon de plus">+</button>
        </div>
        <button class="recyclage__bouton" type="button" data-recycler>
          Recycler · +<span data-recyclage-gain>0</span><img src="assets/monnaie/anima.svg" alt="Animas">
        </button>
      </div>
      <p class="recyclage__message" role="status" data-recyclage-message></p>
    </div>

    <div class="zoom__scene">
      <div class="zoom__carte" role="button" tabindex="0" aria-label="Retourner la carte">
        <div class="zoom__retournable">
          <div class="zoom__face zoom__face--avant"></div>
          <div class="zoom__face zoom__face--dos">
            <img src="assets/cartes/dos.svg" alt="Dos de carte">
          </div>
        </div>
      </div>
      <!-- Cartes Z : un appui maintenu lance leur vidéo (cartes.js) -->
      <p class="zoom__indice" hidden>Maintenez pour déclencher l'animation</p>
    </div>
  </div>

  <script src="reglages.js"></script>
  <script src="sons.js"></script>
  <script src="musique.js"></script>
  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="rendu-carte.js"></script>
  <script src="video-carte.js"></script>
  <script src="compte.js"></script>
  <script src="sauvegarde.js"></script>
  <script src="collection.js"></script>
  <script src="sceaux.js"></script>
  <script src="missions-quotidiennes.js"></script>
  <script src="animas.js"></script>
  <script src="cartes.js"></script>
  <script src="classeurs.js"></script>
  <script src="classeurs-page.js"></script>
  <script src="navigation.js"></script>
</body>
</html>
