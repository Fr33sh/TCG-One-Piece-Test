<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="marge-haut.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accueil</title>
  <link rel="stylesheet" href="carte.css">
  <link rel="stylesheet" href="navigation.css">
  <link rel="stylesheet" href="pack.css">
  <link rel="stylesheet" href="accueil.css">
  <link rel="stylesheet" href="ouverture.css">
</head>
<body>
  <!-- Icône des paramètres : Lucide (licence ISC) -->

  <!-- Filtre des icônes de boosters disponibles : le dos de carte passe aux couleurs de notre univers
       (le noir devient beige parchemin, l'emblème passe en brun doré puis brun foncé) -->
  <svg class="filtres-svg" width="0" height="0" aria-hidden="true">
    <filter id="dos-beige" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0" />
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.890 0.659 0.227" />
        <feFuncG type="table" tableValues="0.800 0.475 0.165" />
        <feFuncB type="table" tableValues="0.608 0.235 0.102" />
      </feComponentTransfer>
    </filter>
    <!-- Sablier de marine : plateaux et montants en bois veiné, clous dorés, cordage, verre avec reflets,
         sable doré (même jaune que la barre de recharge) qui s'écoule en quelques grains -->
    <defs>
      <linearGradient id="sablier-bois" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c08646" />
        <stop offset="1" stop-color="#7d4a1f" />
      </linearGradient>
      <linearGradient id="sablier-montant" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#a8703a" />
        <stop offset="1" stop-color="#6e3f19" />
      </linearGradient>
      <linearGradient id="sablier-sable" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe680" />
        <stop offset="1" stop-color="#e9b10f" />
      </linearGradient>
    </defs>
    <symbol id="icone-sablier" viewBox="0 0 48 48">
      <!-- Verre -->
      <path d="M15 9C15 17 22 20 22 24S15 31 15 39h18c0-8-7-11-7-15s7-7 7-15z" fill="#eaf6ff" fill-opacity="0.5" />
      <!-- Sable : en haut, le filet qui tombe avec quelques grains, le tas en bas -->
      <path d="M17.6 14Q24 15.6 30.4 14C29.4 18 25.6 20.4 24 23 22.4 20.4 18.6 18 17.6 14z" fill="url(#sablier-sable)" />
      <path d="M24 23v9" stroke="#e0a800" stroke-width="1.1" stroke-linecap="round" />
      <circle cx="23.2" cy="27.5" r="0.55" fill="#e0a800" />
      <circle cx="24.8" cy="30" r="0.5" fill="#e0a800" />
      <path d="M16.4 39Q17.6 32.6 24 32 30.4 32.6 31.6 39z" fill="url(#sablier-sable)" stroke="#b8874d" stroke-width="0.6" />
      <!-- Contour et reflets du verre -->
      <path d="M15 9C15 17 22 20 22 24S15 31 15 39h18c0-8-7-11-7-15s7-7 7-15z" fill="none" stroke="#1f1610" stroke-width="1.4" stroke-linejoin="round" />
      <path d="M17.3 11.5C17.6 15 19.4 17.4 20.9 18.8" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="1.2" stroke-linecap="round" />
      <path d="M17.6 36.6C17.9 34.6 18.9 33.4 19.8 32.8" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round" />
      <!-- Montants, avec un cordage enroulé au milieu -->
      <rect x="8.6" y="8.5" width="3.6" height="31" rx="1.6" fill="url(#sablier-montant)" stroke="#1f1610" stroke-width="1.1" />
      <rect x="35.8" y="8.5" width="3.6" height="31" rx="1.6" fill="url(#sablier-montant)" stroke="#1f1610" stroke-width="1.1" />
      <g fill="#e3cc9b" stroke="#5b4a39" stroke-width="0.6">
        <rect x="8" y="21.4" width="4.8" height="1.8" rx="0.9" />
        <rect x="8" y="24.2" width="4.8" height="1.8" rx="0.9" />
        <rect x="35.2" y="21.4" width="4.8" height="1.8" rx="0.9" />
        <rect x="35.2" y="24.2" width="4.8" height="1.8" rx="0.9" />
      </g>
      <!-- Plateaux en bois veiné -->
      <rect x="5" y="3" width="38" height="6.5" rx="2.6" fill="url(#sablier-bois)" stroke="#1f1610" stroke-width="1.4" />
      <rect x="5" y="38.5" width="38" height="6.5" rx="2.6" fill="url(#sablier-bois)" stroke="#1f1610" stroke-width="1.4" />
      <g fill="none" stroke="#5e3414" stroke-opacity="0.55" stroke-width="0.7" stroke-linecap="round">
        <path d="M14 5.4q5-1 10 0t9 0" />
        <path d="M17 7.3q4 .8 8 0" />
        <path d="M15 40.9q5-1 10 0t9 0" />
        <path d="M19 42.8q4 .8 8 0" />
      </g>
      <!-- Clous dorés aux quatre coins -->
      <g fill="#f1d48c" stroke="#8a5a2b" stroke-width="0.6">
        <circle cx="9" cy="6.25" r="1.4" />
        <circle cx="39" cy="6.25" r="1.4" />
        <circle cx="9" cy="41.75" r="1.4" />
        <circle cx="39" cy="41.75" r="1.4" />
      </g>
    </symbol>
  </svg>

  <div class="cadre">
    <div class="parchemin">
      <main class="contenu">
        <a class="profil" href="profil.html" aria-label="Mon profil">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8.5" r="4.5" />
            <path d="M3.5 22a8.5 8.5 0 0 1 17 0z" />
          </svg>
        </a>

        <a class="parametres" href="parametres.html" aria-label="Paramètres">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </a>

        <!-- Toucher le booster le met en avant et affiche les choix d'ouverture -->
        <!-- Le booster est fabriqué par pack.js -->
        <div class="zone-booster" role="button" tabindex="0" aria-label="Choisir comment ouvrir le booster East Blue"></div>

        <!-- Les boosters disponibles, en éventail sur la languette du haut du booster (accueil.js les y place) -->
        <div class="reserve-boosters"></div>

        <!-- Sous le booster : recharge d'un booster toutes les 8 h (barre et temps restant, remplis par recharge.js)
             et, à droite, les Sabliers possédés. Icône de l'horloge : Lucide (licence ISC) -->
        <div class="recharge-bloc">
          <div class="recharge-bulle">
            <div class="recharge" role="progressbar" aria-label="Prochain booster" aria-valuemin="0" aria-valuemax="100">
              <span class="recharge__remplissage"></span>
            </div>
            <span class="recharge__temps">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
              <span class="recharge__texte"></span>
            </span>
          </div>
          <div class="sabliers" role="status" aria-label="Sabliers">
            <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#icone-sablier" /></svg>
            <span class="sabliers__nombre">0</span>
          </div>
        </div>

        <!-- Sous chaque bouton, le prix en Sabliers quand la réserve ne suffit pas (rempli par recharge.js) -->
        <div class="choix-booster">
          <button class="bulle-choix bulle-choix--dix" type="button">Ouvrir 10 Boosters<span class="bulle-choix__cout" hidden><span class="bulle-choix__prix"></span><svg aria-hidden="true"><use href="#icone-sablier" /></svg></span></button>
          <button class="bulle-choix bulle-choix--un" type="button">Ouvrir 1 Booster<span class="bulle-choix__cout" hidden><span class="bulle-choix__prix"></span><svg aria-hidden="true"><use href="#icone-sablier" /></svg></span></button>
          <!-- Icône : Lucide (licence ISC) -->
          <button class="bulle-retour" type="button" aria-label="Retour à l'accueil">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
          </button>
        </div>

        <p class="consigne-ouverture">Glisse d'un bord à l'autre le long de la ligne pour ouvrir le booster</p>
      </main>
    </div>
  </div>

  <nav class="navigation navigation--fixe" data-actif="accueil"></nav>

  <!-- Ouverture d'un booster : étoiles, paquet de cartes qui sort puis se dévoile carte par carte -->
  <div class="ouverture" hidden></div>

  <script src="reglages.js"></script>
  <script src="sons.js"></script>
  <script src="musique.js"></script>
  <script src="donnees/cartes-east-blue.js"></script>
  <script src="rendu-carte.js"></script>
  <script src="compte.js"></script>
  <script src="sauvegarde.js"></script>
  <script src="collection.js"></script>
  <script src="sabliers.js"></script>
  <script src="tirage.js"></script>
  <script src="recharge.js"></script>
  <script src="pack.js"></script>
  <script src="navigation.js"></script>
  <script src="accueil.js"></script>
  <script src="ouverture.js"></script>
</body>
</html>
