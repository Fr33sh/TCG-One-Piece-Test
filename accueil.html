<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="marge-haut.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accueil</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <link rel="stylesheet" href="navigation.css">
  <link rel="stylesheet" href="pack.css">
  <link rel="stylesheet" href="icones-profil.css">
  <link rel="stylesheet" href="accueil.css">
  <link rel="stylesheet" href="ouverture.css">
</head>
<body>
  <!-- Icône des paramètres : Lucide (licence ISC) -->

  <!-- Filtre des icônes de boosters disponibles : le dos de carte passe aux couleurs de notre univers
       (le noir devient beige parchemin, l'emblème passe en brun doré puis brun foncé) -->
  <svg class="filtres-svg" width="0" height="0" aria-hidden="true">
    <filter id="dos-beige" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0" />
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.890 0.659 0.227" />
        <feFuncG type="table" tableValues="0.800 0.475 0.165" />
        <feFuncB type="table" tableValues="0.608 0.235 0.102" />
      </feComponentTransfer>
    </filter>
    <!-- Parchemin des missions : roulé en biais, ficelé d'un ruban rouge noué -->
    <symbol id="icone-parchemin" viewBox="0 0 48 48">
      <g transform="rotate(-35 24 24)" stroke="#1f1610" stroke-linejoin="round" stroke-linecap="round">
        <rect x="6" y="17" width="34" height="14" rx="7" fill="url(#parchemin-papier)" stroke-width="1.4" />
        <ellipse cx="38" cy="24" rx="3.2" ry="7" fill="#ead59f" stroke-width="1.4" />
        <ellipse cx="38" cy="24" rx="1.2" ry="2.8" fill="none" stroke="#8a6d45" stroke-width="1" />
        <rect x="19" y="16.2" width="5" height="15.6" fill="#c0392b" stroke-width="1" />
      </g>
      <g fill="#a82c24" stroke="#1f1610" stroke-width="1" stroke-linejoin="round">
        <path d="M26.5 32l-3.4 8 2.6-.9 1.4 2.6z" />
        <path d="M26.5 32l3.6 7.6 1.2-2.6 2.7.8z" />
        <circle cx="26.5" cy="32" r="2.3" fill="#c0392b" />
      </g>
    </symbol>
    <linearGradient id="parchemin-papier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ecc9" />
      <stop offset="1" stop-color="#d9bf86" />
    </linearGradient>
  </svg>

  <div class="cadre">
    <div class="parchemin">
      <main class="contenu">
        <a class="profil" href="profil.html" aria-label="Mon profil">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8.5" r="4.5" />
            <path d="M3.5 22a8.5 8.5 0 0 1 17 0z" />
          </svg>
        </a>

        <a class="parametres" href="parametres.html" aria-label="Paramètres">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </a>

        <!-- Missions : en bas à droite, au-dessus de la barre de navigation -->
        <a class="missions" href="missions.html" aria-label="Missions">
          <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#icone-parchemin" /></svg>
          <span class="missions__nom">Missions</span>
        </a>

        <!-- Les boosters des séries, côte à côte (un par série, fabriqués par pack.js et placés par accueil.js) :
             en toucher un le met en avant et affiche les choix d'ouverture -->
        <div class="boosters"></div>

        <!-- Sous les boosters : les boosters disponibles en éventail, la recharge d'un booster toutes les 8 h
             (barre et temps restant, remplis par recharge.js) et, à droite, les Sceaux possédés.
             Icône de l'horloge : Lucide (licence ISC) -->
        <div class="recharge-bloc">
          <div class="reserve-boosters"></div>
          <div class="recharge-bulle">
            <div class="recharge" role="progressbar" aria-label="Prochain booster" aria-valuemin="0" aria-valuemax="100">
              <span class="recharge__remplissage"></span>
            </div>
            <span class="recharge__temps">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
              <span class="recharge__texte"></span>
            </span>
          </div>
          <div class="sceaux" role="status" aria-label="Sceaux">
            <img src="assets/icones/sceau.svg" alt="">
            <span class="sceaux__nombre">0</span>
          </div>
        </div>

        <!-- Sous chaque bouton, le prix en Sceaux quand la réserve ne suffit pas (rempli par recharge.js) -->
        <div class="choix-booster">
          <button class="bulle-choix bulle-choix--dix" type="button">Ouvrir 10 Boosters<span class="bulle-choix__cout" hidden><span class="bulle-choix__prix"></span><img src="assets/icones/sceau.svg" alt=""></span></button>
          <button class="bulle-choix bulle-choix--un" type="button">Ouvrir 1 Booster<span class="bulle-choix__cout" hidden><span class="bulle-choix__prix"></span><img src="assets/icones/sceau.svg" alt=""></span></button>
          <!-- Icône : Lucide (licence ISC) -->
          <button class="bulle-retour" type="button" aria-label="Retour à l'accueil">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
          </button>
        </div>

        <p class="consigne-ouverture">Glisse d'un bord à l'autre le long de la ligne pour ouvrir le booster</p>
      </main>
    </div>
  </div>

  <nav class="navigation navigation--fixe" data-actif="accueil"></nav>

  <!-- Ouverture d'un booster : étoiles, paquet de cartes qui sort puis se dévoile carte par carte -->
  <div class="ouverture" hidden></div>

  <script src="reglages.js"></script>
  <script src="sons.js"></script>
  <script src="musique.js"></script>
  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="rendu-carte.js"></script>
  <script src="video-carte.js"></script>
  <script src="compte.js"></script>
  <script src="sauvegarde.js"></script>
  <script src="collection.js"></script>
  <script src="jetons-ssr.js"></script>
  <script src="icones-profil.js"></script>
  <script src="sceaux.js"></script>
  <script src="missions-quotidiennes.js"></script>
  <script src="tirage.js"></script>
  <script src="recharge.js"></script>
  <script src="pack.js"></script>
  <script src="navigation.js"></script>
  <script src="accueil.js"></script>
  <script src="ouverture.js"></script>
</body>
</html>
