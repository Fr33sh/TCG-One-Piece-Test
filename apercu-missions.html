<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aperçu des icônes du bouton Missions</title>
  <!-- Page TEMPORAIRE : propositions d'icônes pour le bouton Missions, à supprimer une fois le choix fait -->
  <style>
    @font-face {
      font-family: "Lilita One";
      src: url("assets/polices/lilita-one.woff2") format("woff2");
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      padding: max(env(safe-area-inset-top), 24px) 14px 40px;
      background: radial-gradient(ellipse at 50% 30%, #e7d2a2 0%, #e0c48f 60%, #d5b47e 100%) fixed;
      color: #1f1610;
      font-family: "Lilita One", "Arial Black", sans-serif;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      text-align: center;
    }

    .aide {
      margin: 6px 0 22px;
      color: #5b4a39;
      font-size: 14px;
      text-align: center;
    }

    .grille {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 420px;
      margin: 0 auto;
    }

    figure {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 0;
      padding: 10px;
      border: 2px solid #b8874d;
      border-radius: 14px;
      background: rgb(255 250 240 / 55%);
    }

    figcaption {
      font-size: 13px;
      line-height: 1.15;
    }

    figcaption b {
      display: block;
      font-size: 20px;
      font-weight: 400;
      color: #8a5a2b;
    }

    /* Même tuile que le bouton Missions de l'accueil */
    .tuile {
      display: flex;
      flex: none;
      flex-direction: column;
      gap: 1px;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border: 2px solid #0b0a09;
      border-radius: 14px;
      background: linear-gradient(180deg, #f6ead0, #e3cc9b);
      box-shadow: 0 0 0 1.5px #b8874d, inset 0 1px 0 rgb(255 255 255 / 60%), inset 0 -2px 0 rgb(120 80 30 / 25%), 0 3px 6px rgb(60 35 10 / 30%);
    }

    .tuile svg {
      width: 34px;
      height: 34px;
      margin-top: -2px;
      filter: drop-shadow(0 1px 1px rgb(60 35 10 / 30%));
    }

    .tuile span {
      font-size: 10px;
      line-height: 1;
    }

    .grand {
      width: 72px;
      height: 72px;
      flex: none;
    }

    .grand svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <h1>Bouton Missions : 12 icônes</h1>
  <p class="aide">À gauche, la taille réelle dans le bouton ; à droite, en grand.<br>Réponds avec le numéro de ton choix.</p>
  <div class="grille"></div>

  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <linearGradient id="d-bois" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c08646" />
        <stop offset="1" stop-color="#7d4a1f" />
      </linearGradient>
      <linearGradient id="d-laiton" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6dc8f" />
        <stop offset="1" stop-color="#b8873a" />
      </linearGradient>
      <linearGradient id="d-papier" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f8ecc9" />
        <stop offset="1" stop-color="#d9bf86" />
      </linearGradient>
    </defs>
  </svg>

  <script>
    const T = 'stroke="#1f1610" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"';
    const T1 = 'stroke="#1f1610" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"';

    const ICONES = [
      ["Parchemin ficelé", `
        <g transform="rotate(-35 24 24)">
          <rect x="6" y="17" width="34" height="14" rx="7" fill="url(#d-papier)" ${T} />
          <ellipse cx="38" cy="24" rx="3.2" ry="7" fill="#ead59f" ${T} />
          <ellipse cx="38" cy="24" rx="1.2" ry="2.8" fill="none" stroke="#8a6d45" stroke-width="1" />
          <rect x="19" y="16.2" width="5" height="15.6" fill="#c0392b" ${T1} />
        </g>
        <path d="M26.5 32l-3.4 8 2.6-.9 1.4 2.6z" fill="#a82c24" ${T1} />
        <path d="M26.5 32l3.6 7.6 1.2-2.6 2.7.8z" fill="#a82c24" ${T1} />
        <circle cx="26.5" cy="32" r="2.3" fill="#c0392b" ${T1} />`],

      ["Avis de recherche", `
        <rect x="9" y="4" width="30" height="40" rx="1" fill="url(#d-papier)" ${T} />
        <text x="24" y="11.6" text-anchor="middle" font-family="'Lilita One','Arial Black',sans-serif" font-size="7" fill="#1f1610">WANTED</text>
        <rect x="13.5" y="14" width="21" height="16" fill="#d9c49a" ${T1} />
        <circle cx="24" cy="20.5" r="3.6" fill="#5b4a39" />
        <path d="M17 30c1-4.5 4-6.5 7-6.5s6 2 7 6.5z" fill="#5b4a39" />
        <path d="M15 33.5h18" stroke="#8a6d45" stroke-width="1.2" stroke-linecap="round" />
        <text x="24" y="40.6" text-anchor="middle" font-family="'Lilita One','Arial Black',sans-serif" font-size="5.4" fill="#1f1610">฿ 1 000</text>`],

      ["Carte au trésor", `
        <path d="M7 9l6-2 5 2 6-2 5 2 6-2 6 2v31l-6 2-5-2-6 2-5-2-6 2-6-2z" fill="url(#d-papier)" ${T} />
        <path d="M18 9v31M30 9v31" stroke="#c9ad78" stroke-width="0.9" />
        <path d="M11.5 16.5c2-3.5 7.5-3.5 8.5 0s-2 5.5-5 4.5-5.5-1-3.5-4.5z" fill="#9cc26b" ${T1} />
        <path d="M17 21c2 6 8 4 10 9s5 3 7 5" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="1.6 2" stroke-linecap="round" />
        <path d="M32.5 32l5 5M37.5 32l-5 5" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round" />
        <path d="M10 34q1.5-1.5 3 0t3 0M22 14q1.5-1.5 3 0t3 0" fill="none" stroke="#4f97d1" stroke-width="1" stroke-linecap="round" />`],

      ["Boussole", `
        <rect x="21" y="2" width="6" height="5" rx="2" fill="url(#d-laiton)" ${T} />
        <circle cx="24" cy="25" r="19" fill="url(#d-laiton)" ${T} />
        <circle cx="24" cy="25" r="14.5" fill="#f6ead0" ${T1} />
        <path d="M24 12v3M24 35v3M11 25h3M34 25h3" stroke="#5b4a39" stroke-width="1.3" stroke-linecap="round" />
        <path d="M24 14.5l3.2 10.5h-6.4z" fill="#c0392b" ${T1} />
        <path d="M24 35.5l3.2-10.5h-6.4z" fill="#2b3a4a" ${T1} />
        <circle cx="24" cy="25" r="1.7" fill="#f1d48c" ${T1} />`],

      ["Longue-vue", `
        <g transform="rotate(-30 24 24)">
          <rect x="3" y="20.5" width="10" height="7" rx="1.5" fill="url(#d-laiton)" ${T} />
          <rect x="12" y="19.5" width="13" height="9" rx="1.5" fill="url(#d-laiton)" ${T} />
          <rect x="24" y="18" width="17" height="12" rx="2" fill="#7d4a1f" ${T} />
          <rect x="24" y="17.5" width="3" height="13" rx="1" fill="url(#d-laiton)" ${T1} />
          <rect x="40" y="16.5" width="4.5" height="15" rx="1.5" fill="url(#d-laiton)" ${T} />
          <path d="M29 20.5h9" stroke="#c08646" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
        </g>`],

      ["Coffre au trésor", `
        <path d="M9 22c3-4 7-4 10-1.5 3-3 7-3 10 0 3-2.5 7-2.5 10 1.5z" fill="#f5c518" stroke="#b8873a" stroke-width="0.8" />
        <rect x="7" y="22" width="34" height="19" rx="2" fill="url(#d-bois)" ${T} />
        <path d="M7 19v-3c0-6 6-9 17-9s17 3 17 9v3z" fill="url(#d-bois)" ${T} />
        <path d="M7 31.5h34" stroke="#5e3414" stroke-width="0.8" opacity="0.6" />
        <rect x="12" y="8.5" width="4" height="32.5" fill="url(#d-laiton)" ${T1} />
        <rect x="32" y="8.5" width="4" height="32.5" fill="url(#d-laiton)" ${T1} />
        <rect x="21" y="18" width="6" height="8" rx="1" fill="url(#d-laiton)" ${T1} />
        <circle cx="24" cy="21.5" r="1" fill="#1f1610" />
        <path d="M24 22v2" stroke="#1f1610" stroke-width="1" />`],

      ["Livre de bord", `
        <rect x="10" y="35" width="27" height="5" fill="#f4e4bc" ${T1} />
        <path d="M8 11h27a3 3 0 0 1 3 3v22H11a3 3 0 0 1-3-3z" fill="#7d4a1f" ${T} />
        <path d="M11 11v25" stroke="#5e3414" stroke-width="1.2" />
        <circle cx="24" cy="23.5" r="6" fill="none" stroke="#f1d48c" stroke-width="1.3" />
        <path d="M24 18.5l1.4 3.6 3.6 1.4-3.6 1.4-1.4 3.6-1.4-3.6-3.6-1.4 3.6-1.4z" fill="#f1d48c" />
        <path d="M44 3c-9 3-15 11-17 20 6-2 13-8 17-20z" fill="#fbfbf7" ${T1} />
        <path d="M27 23l-3 5" stroke="#1f1610" stroke-width="1.3" stroke-linecap="round" />
        <path d="M30 18.5c3-3 6-7 9-11" stroke="#c9b48c" stroke-width="0.8" fill="none" />`],

      ["Bouteille à la mer", `
        <g transform="rotate(-30 24 22)">
          <rect x="5" y="14" width="25" height="15" rx="6.5" fill="#7fc8a9" fill-opacity="0.85" ${T} />
          <path d="M29 18.5h7v6h-7" fill="#7fc8a9" fill-opacity="0.85" ${T} />
          <rect x="35.5" y="17.5" width="5" height="8" rx="1.5" fill="#c08646" ${T1} />
          <rect x="10" y="17.5" width="15" height="8" rx="3.5" fill="#f4e4bc" stroke="#8a6d45" stroke-width="0.9" />
          <path d="M17.5 17.5v8" stroke="#c0392b" stroke-width="1.4" />
          <path d="M9 16.5h14" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
        </g>
        <path d="M3 39q3.5-3 7 0t7 0 7 0 7 0 7 0 7 0" fill="none" stroke="#2f78b8" stroke-width="2.2" stroke-linecap="round" />
        <path d="M8 44q3.5-3 7 0t7 0 7 0 7 0" fill="none" stroke="#4f97d1" stroke-width="1.6" stroke-linecap="round" />`],

      ["Gouvernail", `
        <path d="M3.5 24h41M24 3.5v41M9.5 9.5l29 29M38.5 9.5l-29 29" stroke="#1f1610" stroke-width="3.8" stroke-linecap="round" />
        <path d="M3.5 24h41M24 3.5v41M9.5 9.5l29 29M38.5 9.5l-29 29" stroke="#a8703a" stroke-width="2" stroke-linecap="round" />
        <circle cx="24" cy="24" r="14" fill="none" stroke="#1f1610" stroke-width="6" />
        <circle cx="24" cy="24" r="14" fill="none" stroke="url(#d-bois)" stroke-width="3.6" />
        <circle cx="24" cy="24" r="4.5" fill="url(#d-laiton)" ${T} />
        <g fill="#8a5a2b" ${T1}>
          <circle cx="3.5" cy="24" r="2.6" /><circle cx="44.5" cy="24" r="2.6" />
          <circle cx="24" cy="3.5" r="2.6" /><circle cx="24" cy="44.5" r="2.6" />
          <circle cx="9.5" cy="9.5" r="2.6" /><circle cx="38.5" cy="38.5" r="2.6" />
          <circle cx="38.5" cy="9.5" r="2.6" /><circle cx="9.5" cy="38.5" r="2.6" />
        </g>`],

      ["Ancre", `
        <path d="M8.5 30c2 8 8.5 12 15.5 12s13.5-4 15.5-12" fill="none" stroke="#1f1610" stroke-width="5.4" stroke-linecap="round" />
        <path d="M8.5 30c2 8 8.5 12 15.5 12s13.5-4 15.5-12" fill="none" stroke="#6b7a88" stroke-width="3" stroke-linecap="round" />
        <path d="M4.5 32l6.5-4.5 1.5 6z" fill="#6b7a88" ${T1} />
        <path d="M43.5 32l-6.5-4.5-1.5 6z" fill="#6b7a88" ${T1} />
        <rect x="22" y="10.5" width="4" height="31" rx="1" fill="#6b7a88" ${T1} />
        <rect x="14.5" y="13.5" width="19" height="3.6" rx="1.6" fill="#6b7a88" ${T1} />
        <circle cx="24" cy="7" r="3.6" fill="none" stroke="#1f1610" stroke-width="3.4" />
        <circle cx="24" cy="7" r="3.6" fill="none" stroke="#6b7a88" stroke-width="1.6" />
        <path d="M26 19c6 1.5 6 7 0 8.5s-6 7 0 8.5" fill="none" stroke="#1f1610" stroke-width="3" stroke-linecap="round" />
        <path d="M26 19c6 1.5 6 7 0 8.5s-6 7 0 8.5" fill="none" stroke="#d9b46a" stroke-width="1.6" stroke-linecap="round" />`],

      ["Log Pose", `
        <rect x="4" y="29" width="40" height="9" rx="3" fill="#8a5a2b" ${T} />
        <g fill="#5e3414"><circle cx="9" cy="33.5" r="1" /><circle cx="39" cy="33.5" r="1" /></g>
        <rect x="15" y="26" width="18" height="8" rx="2" fill="url(#d-laiton)" ${T} />
        <circle cx="24" cy="15" r="11" fill="#cfe9fb" fill-opacity="0.85" ${T} />
        <path d="M24 6.5l1.8 8.5-1.8 8.5-1.8-8.5z" fill="#c0392b" ${T1} />
        <path d="M24 15l1.8 8.5-1.8 0z" fill="#2b3a4a" />
        <circle cx="24" cy="15" r="1.4" fill="#f1d48c" ${T1} />
        <path d="M16.5 11.5a8.5 8.5 0 0 1 5-5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
        <ellipse cx="24" cy="26" rx="7.5" ry="2" fill="url(#d-laiton)" ${T1} />`],

      ["Liste à cocher", `
        <rect x="9" y="7" width="30" height="36" rx="2" fill="url(#d-papier)" ${T} />
        <rect x="7" y="4" width="34" height="5.5" rx="2.7" fill="url(#d-bois)" ${T} />
        <g fill="#fffaf0" ${T1}>
          <rect x="13" y="14" width="5.5" height="5.5" rx="1" />
          <rect x="13" y="23" width="5.5" height="5.5" rx="1" />
          <rect x="13" y="32" width="5.5" height="5.5" rx="1" />
        </g>
        <path d="M13.8 16.8l2 2 4-4.6M13.8 25.8l2 2 4-4.6" fill="none" stroke="#3d6b1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M22 17h13M22 26h13M22 35h9" stroke="#8a6d45" stroke-width="1.6" stroke-linecap="round" />`],
    ];

    const grille = document.querySelector(".grille");
    ICONES.forEach(([nom, dessin], index) => {
      const svg = `<svg viewBox="0 0 48 48" aria-hidden="true">${dessin}</svg>`;
      const figure = document.createElement("figure");
      figure.innerHTML = `
        <span class="tuile">${svg}<span>Missions</span></span>
        <span class="grand">${svg}</span>
        <figcaption><b>${index + 1}</b>${nom}</figcaption>`;
      grille.append(figure);
    });
  </script>
</body>
</html>
