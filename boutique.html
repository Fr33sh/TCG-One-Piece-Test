<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="marge-haut.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boutique</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <link rel="stylesheet" href="bordures.css">
  <link rel="stylesheet" href="page.css">
  <link rel="stylesheet" href="boutique.css">
  <link rel="stylesheet" href="navigation.css">
</head>
<body class="avec-navigation page-boutique">
  <header class="barre-page">
    <h1 class="barre-page__titre">Boutique</h1>
    <span class="solde barre-page__solde" role="status" aria-label="Animas possédés">
      <img src="assets/monnaie/anima.svg" alt=""><span data-animas>0</span>
    </span>
  </header>

  <!-- Onglets du haut : la monnaie (boutique.js) -->
  <div class="onglets onglets--relief boutique__monnaies" role="tablist" aria-label="Monnaie">
    <button class="onglets__bouton" type="button" role="tab" aria-selected="true" data-monnaie="animas">Animas</button>
    <button class="onglets__bouton" type="button" role="tab" aria-selected="false" data-monnaie="tokens">Tokens</button>
  </div>

  <main class="liste-bulles">
    <!-- Animas · Décorations : les bordures de cartes, chacune sur une carte du jeu (boutique.js, bordures.js) -->
    <section class="bulle-page" data-rayon="animas-decorations" aria-labelledby="titre-bordures">
      <h2 class="bulle-page__titre" id="titre-bordures">Bordures de cartes</h2>
      <p class="bulle-page__texte">Vote pour tes cadres préférés : 5 au plus par catégorie. Fais glisser pour voir toutes les colonnes.</p>
      <p class="message-page" role="status" data-message-votes></p>
      <div class="colonnes-bordures" data-bordures></div>
    </section>

    <!-- Rayon encore vide -->
    <section class="bulle-page" data-rayon-vide hidden>
      <h2 class="bulle-page__titre">Bientôt</h2>
      <p class="bulle-page__texte">Ce rayon ouvre bientôt ses portes. Reviens vite !</p>
    </section>
  </main>

  <!-- Onglets du bas, juste au-dessus du menu : le rayon (boutique.js) -->
  <div class="onglets onglets--relief boutique__rayons" role="tablist" aria-label="Rayon">
    <button class="onglets__bouton" type="button" role="tab" aria-selected="true" data-rayon-onglet="decorations">Décorations</button>
    <button class="onglets__bouton" type="button" role="tab" aria-selected="false" data-rayon-onglet="evenements">Événements</button>
  </div>

  <nav class="navigation navigation--fixe" data-actif="boutique"></nav>

  <script src="reglages.js"></script>
  <script src="sons.js"></script>
  <script src="musique.js"></script>
  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="rendu-carte.js"></script>
  <script src="compte.js"></script>
  <script src="sauvegarde.js"></script>
  <script src="collection.js"></script>
  <script src="animas.js"></script>
  <script src="bordures.js"></script>
  <script src="boutique.js"></script>
  <script src="navigation.js"></script>
</body>
</html>
