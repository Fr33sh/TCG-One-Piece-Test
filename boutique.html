<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="marge-haut.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boutique</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <link rel="stylesheet" href="bordures.css">
  <link rel="stylesheet" href="page.css">
  <link rel="stylesheet" href="boutique.css">
  <link rel="stylesheet" href="navigation.css">
</head>
<body class="avec-navigation">
  <header class="barre-page">
    <h1 class="barre-page__titre">Boutique</h1>
    <span class="solde barre-page__solde" role="status" aria-label="Animas possédés">
      <img src="assets/monnaie/anima.svg" alt=""><span data-animas>0</span>
    </span>
  </header>

  <main class="liste-bulles">
    <!-- Bordures de cartes : chacune montrée sur une carte du jeu (remplie par boutique.js depuis bordures.js) -->
    <section class="bulle-page" aria-labelledby="titre-bordures">
      <h2 class="bulle-page__titre" id="titre-bordures">Bordures de cartes</h2>
      <p class="bulle-page__texte">Change le cadre de tes cartes.</p>
      <div class="bordures-boutique" data-bordures></div>
    </section>
  </main>

  <nav class="navigation navigation--fixe" data-actif="boutique"></nav>

  <script src="reglages.js"></script>
  <script src="sons.js"></script>
  <script src="musique.js"></script>
  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="rendu-carte.js"></script>
  <script src="compte.js"></script>
  <script src="sauvegarde.js"></script>
  <script src="collection.js"></script>
  <script src="animas.js"></script>
  <script src="bordures.js"></script>
  <script src="boutique.js"></script>
  <script src="navigation.js"></script>
</body>
</html>
