<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aperçu : signes japonais pour le logo ANIMA</title>
  <!-- Page TEMPORAIRE : 15 signes japonais pour le logo ANIMA (noir, touche de prisma, blanc). À supprimer après le choix. -->
  <style>
    @font-face { font-family: "Lilita One"; src: url("assets/polices/lilita-one.woff2") format("woff2"); }
    @font-face { font-family: "Lato"; font-weight: 700; src: url("assets/polices/lato-700.woff2") format("woff2"); }
    @font-face { font-family: "Lato"; font-weight: 400; src: url("assets/polices/lato-400.woff2") format("woff2"); }

    * { box-sizing: border-box; margin: 0; }
    body { padding: max(env(safe-area-inset-top), 24px) 12px 40px; background: #0b0b0d; color: #f2f2f4; font-family: "Lato", sans-serif; }
    h1 { font: 400 24px "Lilita One", sans-serif; text-align: center; }
    .aide { margin: 6px 0 20px; color: #a9a9b3; font-size: 14px; text-align: center; }
    .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 460px; margin: 0 auto; }
    figure { margin: 0; padding: 12px 8px 10px; border: 1px solid #2a2a30; border-radius: 16px; background: radial-gradient(ellipse at 50% 0%, #1d1d23, #0c0c0f 70%); text-align: center; }
    figure svg { display: block; width: 100%; height: auto; }
    figcaption { margin-top: 6px; color: #b8b8c2; font-size: 12px; line-height: 1.3; }
    figcaption b { display: block; font: 400 17px "Lilita One", sans-serif; color: #fff; }
    figcaption b span { background: linear-gradient(90deg, #ff7eb6, #fff07a, #7cc8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body>
  <h1>ANIMA : 15 signes japonais</h1>
  <p class="aide">Le signe deviendra le symbole du jeu (icône de l'appli, boosters…).<br>Réponds avec un numéro.</p>

  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff7eb6" /><stop offset="0.2" stop-color="#ffb86b" /><stop offset="0.4" stop-color="#fff07a" />
        <stop offset="0.6" stop-color="#7dffc4" /><stop offset="0.8" stop-color="#7cc8ff" /><stop offset="1" stop-color="#b98cff" />
      </linearGradient>
    </defs>
  </svg>

  <div class="grille"></div>

  <script>
    // [signe, lecture, sens]
    const SIGNES = [
      ["魂", "tamashii", "l'âme : la traduction exacte d'« anima »"],
      ["霊", "rei", "l'esprit, l'âme des héros disparus"],
      ["心", "kokoro", "le cœur, l'esprit : ce qui anime un héros"],
      ["気", "ki", "l'énergie vitale, celle des combats de manga"],
      ["命", "inochi", "la vie, ce qui fait vivre les personnages"],
      ["夢", "yume", "le rêve, moteur de tous les héros de shōnen"],
      ["光", "hikari", "la lumière, celle qui traverse le prisme"],
      ["虹", "niji", "l'arc-en-ciel : le prisma en un seul signe"],
      ["絆", "kizuna", "le lien entre les héros de tous les mondes"],
      ["札", "fuda", "la carte, le talisman de papier"],
      ["英", "ei", "le héros (premier signe d'« eiyū »)"],
      ["闘", "tō", "le combat, l'affrontement"],
      ["漫", "man", "le premier signe de « manga » (漫画)"],
      ["星", "hoshi", "l'étoile, comme les cartes rares"],
      ["ア", "a", "le « A » d'アニマ (Anima en japonais)"],
    ];

    const grille = document.querySelector(".grille");
    SIGNES.forEach(([signe, lecture, sens], index) => {
      const figure = document.createElement("figure");
      figure.innerHTML = `
        <svg viewBox="0 0 160 160">
          <circle cx="80" cy="64" r="52" fill="none" stroke="url(#p)" stroke-width="4" />
          <circle cx="80" cy="64" r="45" fill="none" stroke="#fff" stroke-width="1" opacity="0.35" />
          <text x="80" y="86" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-weight="700" font-size="60" fill="#fff">${signe}</text>
          <text x="80" y="148" text-anchor="middle" font-family="Lato, sans-serif" font-weight="700" font-size="20" letter-spacing="6" fill="#fff">ANIMA</text>
        </svg>
        <figcaption><b><span>${index + 1}</span> · ${signe} ${lecture}</b>${sens}</figcaption>`;
      grille.append(figure);
    });
  </script>
</body>
</html>
