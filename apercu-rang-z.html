<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cartes de rang Z (aperçu temporaire)</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <style>
    /* Page d'aperçu temporaire : 10 designs pour les cartes de rang Z (3 au plus par collection) */
    body {
      min-height: 100vh;
      padding: 28px 16px 60px;
      background: var(--fond-eclaire, #0b0b0d) fixed;
      color: var(--texte);
      font-family: var(--police-texte);
    }

    h1 {
      margin-bottom: 6px;
      font: 400 26px / 1.1 var(--police-titre);
      text-align: center;
    }

    .aide {
      margin-bottom: 26px;
      color: var(--texte-doux);
      font-size: 14px;
      text-align: center;
    }

    .grille {
      --largeur-carte: calc((min(100vw, 560px) - 52px) / 2);

      display: grid;
      grid-template-columns: repeat(2, var(--largeur-carte));
      justify-content: center;
      gap: 36px 20px;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    figcaption {
      margin-top: 14px;
      font: 400 16px / 1.15 var(--police-titre);
    }

    figcaption small {
      display: block;
      margin-top: 4px;
      color: var(--texte-faible);
      font: 700 11px / 1.3 var(--police-texte);
    }

    /* ── Base commune des cartes Z : calques d'effets au-dessus de l'illustration, sous les textes ── */

    @property --angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    .carte.z {
      position: relative;
    }

    .carte.z .carte__cadre {
      position: relative;
    }

    .carte.z .carte__interieur::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .carte.z .carte__rang-lettre {
      font-size: calc(var(--u) * 92);
      -webkit-text-stroke: calc(var(--u) * 2) rgb(0 0 0 / 40%);
    }

    /* 1. Céleste : or en mouvement, éclat qui balaie l'illustration */
    .z1 {
      background: linear-gradient(135deg, #fff6c8, #e0aa2c 25%, #8a5a0c 45%, #fff2b0 60%, #c08a1e 80%, #fff6c8) 0 0 / 300% 300%;
      --lisere: linear-gradient(180deg, #fffbe6, #d4a22c);
      --halo: 0 0 calc(var(--u) * 80) rgb(255 210 90 / 60%);
      animation: defile 5s linear infinite;
    }
    .z1 .carte__interieur::after {
      background: linear-gradient(115deg, transparent 38%, rgb(255 240 180 / 45%) 47%, rgb(255 255 255 / 70%) 50%, rgb(255 240 180 / 45%) 53%, transparent 62%) 0 0 / 250% 100%;
      mix-blend-mode: screen;
      animation: balaie 4s ease-in-out infinite;
    }
    .z1 .carte__rang-lettre {
      --gemme: linear-gradient(180deg, #fffbe6, #f5c842 50%, #a8761a);
      filter: drop-shadow(0 0 calc(var(--u) * 14) rgb(255 210 90 / 90%));
    }

    /* 2. Prisma infini : l'arc-en-ciel tourne autour, reflets irisés sur toute l'image, halo qui change de couleur */
    .z2 {
      background: conic-gradient(from var(--angle), #ff7eb6, #ffb86b, #fff07a, #7dffc4, #7cc8ff, #b98cff, #ff7eb6);
      --lisere: #fff;
      animation: tourne 4s linear infinite, halo-prisma 4s ease-in-out infinite;
    }
    .z2 .carte__interieur::after {
      background: linear-gradient(125deg, rgb(255 126 182 / 40%), rgb(255 240 122 / 35%), rgb(125 255 196 / 35%), rgb(124 200 255 / 40%), rgb(185 140 255 / 40%), rgb(255 126 182 / 40%)) 0 0 / 300% 300%;
      mix-blend-mode: color-dodge;
      opacity: 0.55;
      animation: defile 6s linear infinite;
    }
    .z2 .carte__rang-lettre {
      --gemme: var(--prisma-diagonal);
      filter: drop-shadow(0 0 calc(var(--u) * 14) rgb(255 255 255 / 80%));
    }

    /* 3. Poussière d'or : noir absolu, filet d'or, paillettes qui scintillent, halo doré qui respire */
    .z3 {
      background: #050506;
      --lisere: linear-gradient(180deg, #fff2b0, #b8861e);
      animation: halo-or 3s ease-in-out infinite;
    }
    .z3 .carte__cadre { padding: calc(var(--u) * 7); }
    .z3::before,
    .z3 .carte__interieur::after {
      background:
        radial-gradient(circle, #ffe9a0 0 calc(var(--u) * 3), transparent calc(var(--u) * 5)) 0 0 / calc(var(--u) * 70) calc(var(--u) * 90),
        radial-gradient(circle, #f5c842 0 calc(var(--u) * 2), transparent calc(var(--u) * 4)) calc(var(--u) * 35) calc(var(--u) * 45) / calc(var(--u) * 70) calc(var(--u) * 90),
        radial-gradient(circle, #fff 0 calc(var(--u) * 1.5), transparent calc(var(--u) * 3)) calc(var(--u) * 15) calc(var(--u) * 60) / calc(var(--u) * 50) calc(var(--u) * 70);
    }
    .z3::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      animation: scintille 2s ease-in-out infinite;
    }
    .z3 .carte__interieur::after {
      mix-blend-mode: screen;
      animation: scintille 2.6s ease-in-out infinite 1s, monte 9s linear infinite;
    }
    .z3 .carte__rang-lettre {
      --gemme: linear-gradient(180deg, #fff6c8, #e0aa2c 55%, #9c6a0e);
      filter: drop-shadow(0 0 calc(var(--u) * 12) rgb(255 200 80 / 85%));
    }

    /* 4. Lumière divine : rayons blancs et dorés qui tournent, lumière tombant du haut */
    .z4 {
      background: repeating-conic-gradient(from var(--angle), #ffffff 0 6deg, #f1e3b8 6deg 12deg);
      --lisere: linear-gradient(180deg, #ffffff, #f5d77a);
      --halo: 0 0 calc(var(--u) * 80) rgb(255 250 220 / 75%), 0 0 calc(var(--u) * 170) rgb(255 240 190 / 35%);
      animation: tourne 24s linear infinite;
    }
    .z4 .carte__interieur::after {
      background: radial-gradient(ellipse at 50% -10%, rgb(255 252 235 / 60%), transparent 55%);
      mix-blend-mode: screen;
    }
    .z4 .carte__rang-lettre {
      --gemme: linear-gradient(180deg, #ffffff, #f5d77a 60%, #c08a1e);
      filter: drop-shadow(0 0 calc(var(--u) * 16) rgb(255 255 230 / 95%));
    }

    /* 5. Cosmos : nébuleuse, étoiles qui scintillent sur le cadre et sur l'image, filet prisma */
    .z5 {
      background:
        radial-gradient(ellipse at 20% 25%, rgb(185 140 255 / 65%), transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgb(124 200 255 / 55%), transparent 50%),
        radial-gradient(ellipse at 60% 10%, rgb(255 126 182 / 45%), transparent 40%),
        #0a0620;
      --lisere: var(--prisma-diagonal);
      animation: halo-violet 3.5s ease-in-out infinite;
    }
    .z5::before,
    .z5 .carte__interieur::after {
      background:
        radial-gradient(circle, #fff 0 calc(var(--u) * 3), transparent calc(var(--u) * 5)) 0 0 / calc(var(--u) * 80) calc(var(--u) * 80),
        radial-gradient(circle, #d6e9ff 0 calc(var(--u) * 2), transparent calc(var(--u) * 4)) calc(var(--u) * 40) calc(var(--u) * 30) / calc(var(--u) * 60) calc(var(--u) * 70),
        radial-gradient(circle, #ffd9ea 0 calc(var(--u) * 1.5), transparent calc(var(--u) * 3)) calc(var(--u) * 20) calc(var(--u) * 50) / calc(var(--u) * 45) calc(var(--u) * 55);
    }
    .z5::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      animation: scintille 2.2s ease-in-out infinite;
    }
    .z5 .carte__interieur::after {
      mix-blend-mode: screen;
      animation: scintille 3s ease-in-out infinite 1.1s;
    }
    .z5 .carte__rang-lettre {
      --gemme: linear-gradient(180deg, #ffffff, #b98cff 55%, #4a2aa8);
      filter: drop-shadow(0 0 calc(var(--u) * 14) rgb(185 140 255 / 90%));
    }

    /* 6. Flamme d'âme : feu violet qui monte, lueur violette au pied de l'image */
    .z6 {
      background: linear-gradient(0deg, #efe6ff, #8a5cff 25%, #2e1588 50%, #8a5cff 75%, #efe6ff) 0 0 / 100% 200%;
      --lisere: #efe6ff;
      animation: monte 2s linear infinite, halo-violet 2.5s ease-in-out infinite;
    }
    .z6 .carte__interieur::after {
      background: linear-gradient(0deg, rgb(138 92 255 / 60%), rgb(138 92 255 / 15%) 30%, transparent 45%);
      mix-blend-mode: screen;
      animation: vacille 1.6s ease-in-out infinite;
    }
    .z6 .carte__rang-lettre {
      --gemme: linear-gradient(180deg, #ffffff, #b99cff 55%, #5a2aa8);
      filter: drop-shadow(0 0 calc(var(--u) * 14) rgb(150 110 255 / 95%));
    }

    /* 7. Diamant : facettes blanches et bleutées qui tournent, éclats sur l'image */
    .z7 {
      background: conic-gradient(from var(--angle), #ffffff, #cfe9ff, #ffffff, #a9d4ff, #f4f9ff, #d6e9ff, #ffffff, #bcdcff, #ffffff);
      --lisere: linear-gradient(180deg, #ffffff, #9fd8ff);
      --halo: 0 0 calc(var(--u) * 75) rgb(200 235 255 / 70%);
      animation: tourne 6s linear infinite;
    }
    .z7::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(60deg, transparent 49%, rgb(80 120 180 / 30%) 50%, transparent 51%),
        linear-gradient(-60deg, transparent 49%, rgb(80 120 180 / 30%) 50%, transparent 51%);
      background-size: calc(var(--u) * 120) calc(var(--u) * 104);
    }
    .z7 .carte__interieur::after {
      background: linear-gradient(60deg, transparent 42%, rgb(255 255 255 / 55%) 50%, transparent 58%) 0 0 / 220% 220%;
      mix-blend-mode: overlay;
      animation: balaie 3s ease-in-out infinite;
    }
    .z7 .carte__rang-lettre {
      --gemme: linear-gradient(180deg, #ffffff, #cfe9ff 50%, #5c9bf5);
      filter: drop-shadow(0 0 calc(var(--u) * 14) rgb(180 225 255 / 95%));
    }

    /* 8. Foudre divine : bleu électrique, éclairs qui illuminent toute la carte par moments */
    .z8 {
      background: linear-gradient(160deg, #0a1a4a, #1d4fd8 50%, #0a1a4a);
      --lisere: #e6f3ff;
      animation: eclair-halo 3s linear infinite;
    }
    .z8 .carte__interieur::after {
      background: radial-gradient(ellipse at 50% 30%, rgb(220 240 255 / 90%), rgb(120 180 255 / 30%) 60%, transparent 85%);
      mix-blend-mode: screen;
      animation: eclair 3s linear infinite;
    }
    .z8 .carte__rang-lettre {
      --gemme: linear-gradient(180deg, #ffffff, #9fd0ff 55%, #1d4fd8);
      filter: drop-shadow(0 0 calc(var(--u) * 14) rgb(120 190 255 / 95%));
    }

    /* 9. Sceau impérial : laque rouge, double filet et coins d'or, reflet doré qui passe */
    .z9 {
      background: linear-gradient(160deg, #c21a24, #5a060c);
      --lisere: linear-gradient(180deg, #ffe7a0, #c08a1e);
      box-shadow: inset 0 0 0 calc(var(--u) * 13) #7a0a12, inset 0 0 0 calc(var(--u) * 18) #f0c75a, 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 70) rgb(240 180 60 / 55%);
    }
    .z9::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at 0 0, #f5d77a 0 calc(var(--u) * 70), #b8861e calc(var(--u) * 70) calc(var(--u) * 74), transparent calc(var(--u) * 75)),
        radial-gradient(circle at 100% 0, #f5d77a 0 calc(var(--u) * 70), #b8861e calc(var(--u) * 70) calc(var(--u) * 74), transparent calc(var(--u) * 75)),
        radial-gradient(circle at 0 100%, #f5d77a 0 calc(var(--u) * 70), #b8861e calc(var(--u) * 70) calc(var(--u) * 74), transparent calc(var(--u) * 75)),
        radial-gradient(circle at 100% 100%, #f5d77a 0 calc(var(--u) * 70), #b8861e calc(var(--u) * 70) calc(var(--u) * 74), transparent calc(var(--u) * 75));
    }
    .z9 .carte__interieur::after {
      background: linear-gradient(115deg, transparent 40%, rgb(255 215 120 / 45%) 50%, transparent 60%) 0 0 / 250% 100%;
      mix-blend-mode: screen;
      animation: balaie 5s ease-in-out infinite;
    }
    .z9 .carte__rang-lettre {
      --gemme: linear-gradient(180deg, #fff6c8, #e0aa2c 55%, #9c6a0e);
      filter: drop-shadow(0 0 calc(var(--u) * 12) rgb(255 200 80 / 90%));
    }

    /* 10. Chrome holographique : métal miroir, arc-en-ciel qui ruisselle sur toute la carte */
    .z10 {
      background: linear-gradient(135deg, #f5f5f8, #9a9aa6 20%, #ffffff 40%, #7a7a86 60%, #e8e8ee 80%, #b0b0bb);
      --lisere: #fff;
      --halo: 0 0 calc(var(--u) * 70) rgb(220 220 255 / 55%);
    }
    .z10::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      background: repeating-linear-gradient(110deg, #ff7eb6 0, #fff07a 8%, #7dffc4 16%, #7cc8ff 24%, #b98cff 32%, #ff7eb6 40%) 0 0 / 250% 250%;
      mix-blend-mode: color-dodge;
      opacity: 0.4;
      pointer-events: none;
      animation: defile 7s linear infinite;
    }
    .z10 .carte__rang-lettre {
      --gemme: var(--prisma-diagonal);
      filter: drop-shadow(0 0 calc(var(--u) * 12) rgb(255 255 255 / 90%));
    }

    /* ── Animations ── */

    @keyframes defile { to { background-position: 300% 300%; } }
    @keyframes tourne { to { --angle: 360deg; } }
    @keyframes monte { to { background-position: 0 -200%; } }

    @keyframes balaie {
      0% { background-position: 150% 0; }
      70%, 100% { background-position: -150% 0; }
    }

    @keyframes scintille {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    @keyframes vacille {
      0%, 100% { opacity: 0.75; }
      30% { opacity: 1; }
      60% { opacity: 0.6; }
    }

    @keyframes halo-prisma {
      0%, 100% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 80) rgb(255 126 182 / 60%); }
      33% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 80) rgb(125 255 196 / 60%); }
      66% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 80) rgb(124 200 255 / 60%); }
    }

    @keyframes halo-or {
      0%, 100% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 35) rgb(255 200 80 / 45%); }
      50% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 100) rgb(255 200 80 / 75%); }
    }

    @keyframes halo-violet {
      0%, 100% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 40) rgb(150 110 255 / 45%); }
      50% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 100) rgb(150 110 255 / 80%); }
    }

    @keyframes eclair {
      0%, 88%, 92%, 96%, 100% { opacity: 0; }
      90%, 94% { opacity: 0.55; }
    }

    @keyframes eclair-halo {
      0%, 88%, 92%, 96%, 100% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 50) rgb(60 130 255 / 55%); }
      90%, 94% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 140) rgb(200 230 255 / 95%); }
    }
  </style>
</head>
<body>
  <h1>Cartes de rang Z</h1>
  <p class="aide">Aperçu temporaire : 3 cartes Z au plus par collection. Dis-moi le design qui te plaît.</p>
  <div class="grille"></div>

  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="rendu-carte.js"></script>
  <script>
    LETTRES_RANG[5] = "Z";
    const DESIGNS = [
      ["Céleste", "Or en mouvement, éclat qui balaie l'image"],
      ["Prisma infini", "Arc-en-ciel qui tourne, reflets irisés"],
      ["Poussière d'or", "Noir absolu, paillettes d'or qui scintillent"],
      ["Lumière divine", "Rayons blancs et dorés qui tournent"],
      ["Cosmos", "Nébuleuse et étoiles scintillantes"],
      ["Flamme d'âme", "Feu violet qui monte"],
      ["Diamant", "Facettes qui tournent, éclats sur l'image"],
      ["Foudre divine", "Éclairs qui illuminent la carte"],
      ["Sceau impérial", "Laque rouge, coins et filets d'or"],
      ["Chrome holographique", "Métal miroir, arc-en-ciel qui ruisselle"],
    ];
    // Les plus rares de chaque collection servent de modèles
    const modeles = CARTES.filter(carte => carte.rang === 4 && carte.illustration);
    const grille = document.querySelector(".grille");
    DESIGNS.forEach(([nom, description], i) => {
      const modele = modeles[Math.floor(i * modeles.length / DESIGNS.length)];
      const carte = creerCarte({ ...modele, rang: 5 });
      carte.classList.add("z", `z${i + 1}`);
      const figure = element("figure");
      const legende = element("figcaption", "", `${i + 1}. ${nom}`);
      legende.append(element("small", "", description));
      figure.append(carte, legende);
      grille.append(figure);
    });
    document.fonts.ready.then(() => ajusterProprietes(grille));
  </script>
</body>
</html>
