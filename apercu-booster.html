<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Booster Naruto : choix de l'illustration</title>
  <!-- Page TEMPORAIRE : 16 visuels officiels de la première série Naruto (MyAnimeList, AniList), posés dans le vrai
       booster Naruto (pack.js, pack.css). À supprimer après le choix. -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="pack.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { padding: max(env(safe-area-inset-top), 24px) 14px 40px; background: var(--fond-eclaire) fixed; color: var(--texte); font-family: var(--police-texte); }
    h1 { font: 400 24px var(--police-titre); text-align: center; }
    .aide { margin: 6px auto 20px; max-width: 460px; color: var(--texte-doux); font-size: 14px; line-height: 1.4; text-align: center; }
    .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 14px; max-width: 520px; margin: 0 auto; justify-items: center; }
    .grille .booster { --l: calc((min(100vw, 520px) - 28px - 14px) / 2 - 10px); }
    figure { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0; }
    figcaption { color: var(--texte-doux); font-size: 12px; text-align: center; line-height: 1.3; }
    figcaption b { display: block; color: var(--texte); font: 400 18px var(--police-titre); }
  </style>
</head>
<body>
  <h1>Booster Naruto : 16 illustrations</h1>
  <p class="aide">Des visuels officiels de la première série (2002-2006), posés dans le vrai booster.
    Vérifie l'époque (Pays des Vagues) et réponds avec un numéro.</p>
  <div class="grille"></div>

  <script>
    const SERIES = [];
    const SOURCES = [
      "Série (MyAnimeList)", "Série (MyAnimeList)", "Série (MyAnimeList)", "Série (MyAnimeList)", "Série (MyAnimeList)",
      "Série (MyAnimeList)", "Série (MyAnimeList)", "Série (MyAnimeList)", "Série (MyAnimeList)", "Série (MyAnimeList)",
      "Série (MyAnimeList)", "Affiche de la série (AniList)", "OAV « Le trèfle à quatre feuilles » (2003)",
      "OAV « Bataille au village de la Cascade » (2003)", "Film « La Légende de la pierre de Guelel » (2005)",
      "Film « Mission spéciale au pays de la Lune » (2006)",
    ];
  </script>
  <script src="pack.js"></script>
  <script>
    const naruto = { id: "naruto", nom: "Naruto", code: "NA" };
    document.querySelector(".grille").append(...SOURCES.map((source, i) => {
      const numero = String(i + 1).padStart(2, "0");
      const booster = creerPack(naruto);
      const image = booster.querySelector(".pack__illustration img");
      image.className = "";
      image.src = `assets/naruto-booster/${numero}.jpg`;
      const figure = document.createElement("figure");
      figure.append(booster);
      figure.insertAdjacentHTML("beforeend", `<figcaption><b>${i + 1}</b>${source}</figcaption>`);
      return figure;
    }));
  </script>
</body>
</html>
