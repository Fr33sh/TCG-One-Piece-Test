<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Booster Bleach : 15 designs</title>
  <!-- Page TEMPORAIRE : 15 designs pour le booster Bleach (couleurs + illustration officielle), dans le vrai booster
       (pack.js, pack.css). À supprimer après le choix. -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="pack.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { padding: max(env(safe-area-inset-top), 24px) 14px 40px; background: var(--fond-eclaire) fixed; color: var(--texte); font-family: var(--police-texte); }
    h1 { font: 400 24px var(--police-titre); text-align: center; }
    .aide { margin: 6px auto 20px; max-width: 460px; color: var(--texte-doux); font-size: 14px; line-height: 1.4; text-align: center; }
    .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px 14px; max-width: 520px; margin: 0 auto; justify-items: center; }
    .grille .booster { --l: calc((min(100vw, 520px) - 28px - 14px) / 2 - 10px); }
    figure { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0; }
    figcaption { max-width: 170px; color: var(--texte-doux); font-size: 12px; text-align: center; line-height: 1.3; }
    figcaption b { display: block; color: var(--texte); font: 400 17px var(--police-titre); }

    /* ── Thèmes de couleurs (en-tête, pied, écritures) ── */
    .pack[class*="bl-"] { --motif: url("assets/logo/anima-symbole.svg"); }
    .pack[class*="bl-"] .pack__entete::before, .pack[class*="bl-"] .pack__pied::before { opacity: 0.25; }

    /* Noir & blanc */
    .bl-noir .pack__entete { background: linear-gradient(180deg, #3a3a42, #121216 60%, #26262d); border-bottom-color: #fff; }
    .bl-noir .pack__pied { background: linear-gradient(180deg, #26262d, #0b0b0d); border-top-color: #fff; }
    .bl-noir .pack__logo { color: #fff; }
    /* Orange Ichigo */
    .bl-orange .pack__entete { background: linear-gradient(180deg, #ffb35c, #f07a1a 55%, #ff9a3c); border-bottom-color: #1a1a1f; }
    .bl-orange .pack__pied { background: linear-gradient(180deg, #f07a1a, #c2500f); border-top-color: #1a1a1f; }
    .bl-orange .pack__logo { color: #fff; }
    /* Shinigami : noir et rouge */
    .bl-shinigami .pack__entete { background: linear-gradient(180deg, #2a1416, #0e0607 60%, #1e0c0d); border-bottom-color: #d4242e; }
    .bl-shinigami .pack__pied { background: linear-gradient(180deg, #1e0c0d, #0e0607); border-top-color: #d4242e; }
    .bl-shinigami .pack__logo { color: #ff4b52; }
    /* Hollow : blanc os, noir et rouge */
    .bl-hollow .pack__entete { background: linear-gradient(180deg, #ffffff, #e6e1d6 60%, #f4f1ea); border-bottom-color: #b01822; }
    .bl-hollow .pack__pied { background: linear-gradient(180deg, #e6e1d6, #c9c2b3); border-top-color: #b01822; }
    .bl-hollow .pack__logo { color: #fff; }
    /* Rukia : bleu glacier et blanc */
    .bl-glace .pack__entete { background: linear-gradient(180deg, #e6f4ff, #9fd0f5 55%, #cbe7fb); border-bottom-color: #fff; }
    .bl-glace .pack__pied { background: linear-gradient(180deg, #9fd0f5, #5fa6dc); border-top-color: #fff; }
    .bl-glace .pack__logo { color: #fff; }
  </style>
</head>
<body>
  <h1>Booster Bleach : 15 designs</h1>
  <p class="aide">5 thèmes de couleurs × des illustrations officielles du début de Bleach, dans le vrai booster.
    Réponds avec un numéro (ou « le thème du 3 avec l'image du 8 »).</p>
  <div class="grille"></div>

  <script>
    const SERIES = [];
    // [thème, couleurs du titre en arc (dégradé, puis relief), nom du thème]
    const THEMES = {
      noir: { nom: "Noir & blanc", degrade: ["#ffffff", "#d9d9e0", "#9a9aa6"], relief: ["#0b0b0d", "#16161b", "#202027", "#2b2b33"] },
      orange: { nom: "Orange Ichigo", degrade: ["#ffd9a8", "#ff8a2a", "#c2500f"], relief: ["#1a0b02", "#2a1305", "#3a1b07", "#4a230a"] },
      shinigami: { nom: "Shinigami (noir et rouge)", degrade: ["#ff8a8f", "#e02a35", "#8f0f17"], relief: ["#0e0607", "#180a0b", "#220e10", "#2c1214"] },
      hollow: { nom: "Hollow (blanc os et rouge)", degrade: ["#ffffff", "#ece7dc", "#bdb4a3"], relief: ["#5a0a10", "#6e0d14", "#82111a", "#961520"] },
      glace: { nom: "Glace (Rukia)", degrade: ["#ffffff", "#bfe3fb", "#6fb2e6"], relief: ["#0d2a45", "#123555", "#174065", "#1c4b75"] },
    };
    const IMAGES = {
      "01": "Série (MyAnimeList)", "02": "Série (MyAnimeList)", "03": "Série (MyAnimeList)", "04": "Série (MyAnimeList)",
      "05": "Série (MyAnimeList)", "06": "Série (MyAnimeList)", "07": "Affiche de la série (AniList)",
      "08": "« Memories in the Rain » (2004)", "09": "« The Sealed Sword Frenzy » (2006)",
    };
    const EXTENSIONS = { "07": "png", "09": "png" };
    // Les 15 designs : [thème, image]
    const DESIGNS = [
      ["noir", "07"], ["orange", "08"], ["shinigami", "01"], ["hollow", "02"], ["glace", "03"],
      ["noir", "04"], ["orange", "05"], ["shinigami", "06"], ["hollow", "09"], ["glace", "08"],
      ["orange", "07"], ["noir", "01"], ["shinigami", "09"], ["hollow", "07"], ["glace", "04"],
    ];
  </script>
  <script src="pack.js"></script>
  <script>
    const bleach = { id: "bleach", nom: "Bleach", code: "BL" };
    document.querySelector(".grille").append(...DESIGNS.map(([theme, image], i) => {
      const t = THEMES[theme];
      const booster = creerPack({ ...bleach, id: `bleach-${i}` }, {
        classe: `bl-${theme}`,
        entete: `<span class="pack__logo">Bleach</span>`,
        edition: "Anima",
        illustration: `<img src="assets/bleach-booster/${image}.${EXTENSIONS[image] || "jpg"}" alt="">`,
        titre: "SHINIGAMI",
        degrade: t.degrade,
        relief: t.relief,
      });
      const figure = document.createElement("figure");
      figure.append(booster);
      figure.insertAdjacentHTML("beforeend", `<figcaption><b>${i + 1}</b>${t.nom} · ${IMAGES[image]}</figcaption>`);
      return figure;
    }));
  </script>
</body>
</html>
