<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aperçu : le nom sur les cartes</title>
  <!-- Page TEMPORAIRE : 12 propositions de position et de police pour le nom des cartes. Les cartes sont les
       vraies cartes du jeu (rendu-carte.js, carte.css) ; seule une classe « nom-N » change. À supprimer après le choix. -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <style>
    body { margin: 0; padding: max(env(safe-area-inset-top), 24px) 14px 40px; background: var(--fond-eclaire) fixed; color: var(--texte); font-family: var(--police-texte); }
    h1 { margin: 0; font: 400 24px var(--police-titre); text-align: center; }
    .aide { margin: 6px 0 0; color: var(--texte-doux); font-size: 14px; line-height: 1.35; text-align: center; }
    .bloc { margin-top: 18px; padding: 14px 12px; border: 1px solid var(--bord); border-radius: 18px; background: var(--surface); }
    .bloc h3 { margin: 0 0 4px; font: 400 19px var(--police-titre); }
    .bloc h3 span { background: var(--prisma); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .bloc p { margin: 0 0 12px; color: var(--texte-doux); font-size: 13px; line-height: 1.35; }
    .cartes { --largeur-carte: calc((min(100vw, 520px) - 28px - 24px - 12px) / 2); display: grid; grid-template-columns: repeat(2, var(--largeur-carte)); justify-content: center; gap: 12px; }

    /* Positions sorties du flux : la description reste en bas */
    .nom-3 .carte__texte, .nom-5 .carte__texte, .nom-10 .carte__texte { margin-top: auto; }

    /* 2 · Lilita, aligné à gauche */
    .nom-2 .carte__nom { font: 400 calc(var(--u) * 82) / 1 var(--police-titre); text-align: left; text-transform: none; letter-spacing: calc(var(--u) * 1); }
    .nom-2 .carte__nom--long { font-size: calc(var(--u) * 66); }
    .nom-2 .carte__nom--tres-long { font-size: calc(var(--u) * 52); }

    /* 3 · En haut à gauche, Lato espacé */
    .nom-3 .carte__nom { position: absolute; top: calc(var(--u) * 66); right: calc(var(--u) * 170); left: calc(var(--u) * 44); margin: 0; padding: 0; font: 700 calc(var(--u) * 50) / 1.1 var(--police-texte); letter-spacing: 0.12em; text-align: left; }
    .nom-3 .carte__nom--long, .nom-3 .carte__nom--tres-long { font-size: calc(var(--u) * 40); }

    /* 4 · Bandeau noir sur toute la largeur, liseré prisma */
    .nom-4 .carte__nom {
      margin-right: calc(var(--u) * -44);
      margin-left: calc(var(--u) * -44);
      padding: calc(var(--u) * 16) calc(var(--u) * 44) calc(var(--u) * 20);
      background: linear-gradient(var(--prisma)) bottom / 100% calc(var(--u) * 6) no-repeat, rgb(11 11 13 / 82%);
      font: 400 calc(var(--u) * 66) / 1 var(--police-titre);
      text-transform: none;
    }
    .nom-4 .carte__nom--long { font-size: calc(var(--u) * 56); }
    .nom-4 .carte__nom--tres-long { font-size: calc(var(--u) * 46); }

    /* 5 · Vertical, le long du bord gauche (se lit de bas en haut) */
    .nom-5 .carte__nom {
      position: absolute;
      top: calc(var(--u) * 150);
      bottom: calc(var(--u) * 300);
      left: calc(var(--u) * 34);
      margin: 0;
      padding: 0;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font: 400 calc(var(--u) * 86) / 1 var(--police-titre);
      letter-spacing: calc(var(--u) * 6);
      text-align: left;
    }
    .nom-5 .carte__nom--long { font-size: calc(var(--u) * 70); }
    .nom-5 .carte__nom--tres-long { font-size: calc(var(--u) * 56); }

    /* 6 · Cartouche au contour prisma */
    .nom-6 .carte__nom {
      align-self: center;
      padding: calc(var(--u) * 14) calc(var(--u) * 44);
      border: calc(var(--u) * 6) solid transparent;
      border-radius: 999px;
      background: linear-gradient(rgb(11 11 13 / 82%), rgb(11 11 13 / 82%)) padding-box, var(--prisma-diagonal) border-box;
      font: 700 calc(var(--u) * 46) / 1 var(--police-texte);
      letter-spacing: 0.1em;
    }
    .nom-6 .carte__nom--long, .nom-6 .carte__nom--tres-long { font-size: calc(var(--u) * 38); }

    /* 7 · Grand titre Playfair, à gauche */
    .nom-7 .carte__nom { font: 900 calc(var(--u) * 104) / 0.95 "Playfair Display", serif; text-align: left; text-transform: none; }
    .nom-7 .carte__nom--long { font-size: calc(var(--u) * 84); }
    .nom-7 .carte__nom--tres-long { font-size: calc(var(--u) * 66); }

    /* 8 · Signature : italique à empattements, trait prisma dessous */
    .nom-8 .carte__nom { font: italic 400 calc(var(--u) * 88) / 1 "IM Fell English", serif; text-align: left; text-transform: none; }
    .nom-8 .carte__nom::after { content: ""; display: block; width: 38%; height: calc(var(--u) * 5); margin-top: calc(var(--u) * 12); border-radius: calc(var(--u) * 3); background: var(--prisma); }
    .nom-8 .carte__nom--long { font-size: calc(var(--u) * 72); }
    .nom-8 .carte__nom--tres-long { font-size: calc(var(--u) * 58); }

    /* 9 · Contour manga : lettres blanches cernées de noir, ombre décalée */
    .nom-9 .carte__nom {
      font: 400 calc(var(--u) * 78) / 1.05 "Alfa Slab One", serif;
      text-transform: none;
      -webkit-text-stroke: calc(var(--u) * 12) #0b0b0d;
      paint-order: stroke fill;
      text-shadow: calc(var(--u) * 8) calc(var(--u) * 8) 0 #0b0b0d;
      transform: rotate(-3deg);
    }
    .nom-9 .carte__nom--long { font-size: calc(var(--u) * 64); }
    .nom-9 .carte__nom--tres-long { font-size: calc(var(--u) * 50); }

    /* 10 · Plaque en haut au centre */
    .nom-10 .carte__nom {
      position: absolute;
      top: calc(var(--u) * 50);
      left: 50%;
      max-width: calc(var(--u) * 800);
      margin: 0;
      padding: calc(var(--u) * 12) calc(var(--u) * 34);
      border: calc(var(--u) * 3) solid rgb(255 255 255 / 35%);
      border-radius: calc(var(--u) * 22);
      background: rgb(11 11 13 / 72%);
      font: 700 calc(var(--u) * 42) / 1.1 var(--police-texte);
      letter-spacing: 0.14em;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .nom-10 .carte__nom--long, .nom-10 .carte__nom--tres-long { font-size: calc(var(--u) * 34); }

    /* 11 · Lilita, aligné à droite */
    .nom-11 .carte__nom { font: 400 calc(var(--u) * 82) / 1 var(--police-titre); text-align: right; text-transform: none; }
    .nom-11 .carte__nom--long { font-size: calc(var(--u) * 66); }
    .nom-11 .carte__nom--tres-long { font-size: calc(var(--u) * 52); }

    /* 12 · Lettres prisma */
    .nom-12 .carte__nom {
      font: 400 calc(var(--u) * 84) / 1.05 var(--police-titre);
      text-transform: none;
      background: var(--prisma);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 calc(var(--u) * 4) calc(var(--u) * 6) rgb(0 0 0 / 80%));
    }
    .nom-12 .carte__nom--long { font-size: calc(var(--u) * 68); }
    .nom-12 .carte__nom--tres-long { font-size: calc(var(--u) * 54); }
  </style>
</head>
<body>
  <h1>Le nom sur les cartes : 12 propositions</h1>
  <p class="aide">Position et police du nom, sur les vraies cartes (bordure Noir lumineux appliquée).<br>Réponds avec un numéro.</p>
  <div data-propositions></div>

  <script src="donnees/cartes-east-blue.js"></script>
  <script src="rendu-carte.js"></script>
  <script>
    const PROPOSITIONS = [
      ["Classique", "Centré au-dessus de la description, lettres capitales à empattements (le style actuel)."],
      ["Lilita à gauche", "Aligné à gauche, police ronde et épaisse du jeu, sans capitales forcées."],
      ["En haut à gauche", "Tout en haut, face à la rareté, en Lato espacé : l'illustration respire en bas."],
      ["Bandeau noir", "Dans un bandeau noir sur toute la largeur, souligné d'un trait prisma."],
      ["Vertical", "Le long du bord gauche, à lire de bas en haut, comme sur une affiche de manga."],
      ["Cartouche prisma", "Dans une pastille sombre au contour prisma, centrée."],
      ["Grand titre", "Très grand, en Playfair, aligné à gauche : très « affiche de film »."],
      ["Signature", "En italique élégant, aligné à gauche, souligné d'un trait prisma."],
      ["Contour manga", "Lettres blanches cernées de noir et ombre décalée, légèrement penchées."],
      ["Plaque en haut", "Dans une petite plaque sombre, centrée en haut de la carte."],
      ["Lilita à droite", "Aligné à droite, police ronde et épaisse du jeu."],
      ["Lettres prisma", "Le nom écrit en dégradé prisma, police ronde du jeu."],
    ];

    document.querySelector("[data-propositions]").append(...PROPOSITIONS.map(([nom, texte], i) => {
      const section = document.createElement("section");
      section.className = "bloc";
      section.innerHTML = `<h3><span>${i + 1}</span> · ${nom}</h3><p>${texte}</p>`;
      const grille = document.createElement("div");
      grille.className = "cartes";
      for (const id of ["EB-028", "EB-057"]) {
        const rendu = creerCarte(CARTES.find(c => c.id === id));
        if (i) rendu.classList.add(`nom-${i + 1}`);
        grille.append(rendu);
      }
      section.append(grille);
      return section;
    }));

    document.fonts.ready.then(() => ajusterProprietes());
  </script>
</body>
</html>
