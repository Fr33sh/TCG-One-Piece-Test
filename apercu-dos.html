<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aperçu : dos des cartes</title>
  <!-- Page TEMPORAIRE, fabriquée par outils/dos.mjs : modèles de dos de carte. À supprimer après le choix. -->
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { padding: max(env(safe-area-inset-top), 24px) 14px 40px; background: var(--fond-eclaire) fixed; color: var(--texte); font-family: var(--police-texte); }
    h1 { font: 400 24px var(--police-titre); text-align: center; }
    .aide { margin: 6px 0 22px; color: var(--texte-doux); font-size: 14px; text-align: center; }
    .modeles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 14px; max-width: 520px; margin: 0 auto; }
    figure { margin: 0; }
    figure img { display: block; width: 100%; border-radius: 6%/4.3%; box-shadow: 0 10px 24px rgb(0 0 0 / 60%); }
    figcaption { margin-top: 8px; color: var(--texte-doux); font-size: 12px; line-height: 1.3; }
    figcaption b { display: block; color: var(--texte); font: 400 17px var(--police-titre); }
  </style>
</head>
<body>
  <h1>Dos des cartes : 6 modèles</h1>
  <p class="aide">Réponds avec un numéro (ou une combinaison).</p>
  <div class="modeles">
    <figure><img src="assets/cartes/dos-modeles/dos-1.svg" alt=""><figcaption><b>1. Blanc épuré</b>Carte blanche, double cadre noir fin, le logo au centre en noir avec son anneau prisma. Simple et élégant.</figcaption></figure>
    <figure><img src="assets/cartes/dos-modeles/dos-2.svg" alt=""><figcaption><b>2. Blanc irisé</b>Carte blanche traversée de reflets pastel irisés, comme une carte holographique ; cadre prisma.</figcaption></figure>
    <figure><img src="assets/cartes/dos-modeles/dos-3.svg" alt=""><figcaption><b>3. Noir prisma</b>Carte noire comme l'appli, lueur douce au centre, logo blanc, cadre blanc et liseré prisma.</figcaption></figure>
    <figure><img src="assets/cartes/dos-modeles/dos-4.svg" alt=""><figcaption><b>4. Motif 魂</b>Carte blanche couverte d'un motif discret de petits 魂 en biais, grand médaillon noir au centre.</figcaption></figure>
    <figure><img src="assets/cartes/dos-modeles/dos-5.svg" alt=""><figcaption><b>5. Rayons</b>Carte blanche à rayons gris très clairs, comme une explosion de manga, grand anneau prisma autour du logo.</figcaption></figure>
    <figure><img src="assets/cartes/dos-modeles/dos-6.svg" alt=""><figcaption><b>6. Diagonale</b>Moitié blanche, moitié noire, séparées par un trait prisma ; le logo au centre, à cheval sur les deux.</figcaption></figure>
  </div>
</body>
</html>
