<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bordures de cartes, série 2 (aperçu temporaire)</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <style>
    /* Page d'aperçu temporaire : 20 nouvelles bordures de cartes, chacune posée sur une carte du jeu */
    body {
      min-height: 100vh;
      padding: 28px 16px 60px;
      background: var(--fond-eclaire, #0b0b0d) fixed;
      color: var(--texte);
      font-family: var(--police-texte);
    }

    h1 {
      margin-bottom: 6px;
      font: 400 26px / 1.1 var(--police-titre);
      text-align: center;
    }

    .aide {
      margin-bottom: 24px;
      color: var(--texte-doux);
      font-size: 14px;
      text-align: center;
    }

    .grille {
      --largeur-carte: calc((min(100vw, 560px) - 52px) / 2);

      display: grid;
      grid-template-columns: repeat(2, var(--largeur-carte));
      justify-content: center;
      gap: 30px 20px;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    figcaption {
      margin-top: 12px;
      font: 400 16px / 1.15 var(--police-titre);
    }

    figcaption small {
      display: block;
      margin-top: 4px;
      color: var(--texte-faible);
      font: 700 11px / 1.3 var(--police-texte);
    }

    /* ── Les bordures : le fond de .carte fait le cadre extérieur, --lisere le filet intérieur ── */

    .carte.b1 { /* Bronze antique, patine verte */
      background:
        radial-gradient(ellipse at 15% 85%, rgb(70 150 125 / 45%), transparent 35%),
        radial-gradient(ellipse at 85% 10%, rgb(70 150 125 / 35%), transparent 30%),
        linear-gradient(145deg, #e2b07a, #a8682e 30%, #5e3514 55%, #c98c4c 78%, #7a4a20);
      --lisere: #f0c99a;
      --halo: 0 0 calc(var(--u) * 40) rgb(200 140 80 / 35%);
    }

    .carte.b2 { /* Or rose */
      background: linear-gradient(145deg, #ffe3dc, #e8a598 30%, #b86b62 55%, #f6cfc6 78%, #c8877c);
      --lisere: #fff0ec;
      --halo: 0 0 calc(var(--u) * 50) rgb(240 160 150 / 45%);
    }

    .carte.b3 { /* Aurore boréale : voiles verts et violets qui glissent */
      background: linear-gradient(100deg, #06121f, #1de9b6, #0a2a3a, #7c4dff, #06121f, #1de9b6) 0 0 / 300% 100%;
      --lisere: #d9fff5;
      --halo: 0 0 calc(var(--u) * 55) rgb(29 233 182 / 40%);
      animation: glisse 8s linear infinite;
    }

    .carte.b4 { /* Coucher de soleil */
      background: linear-gradient(180deg, #ffd27a, #ff8a5c 35%, #e0507a 65%, #6a2c8a);
      --lisere: #fff3d6;
      --halo: 0 0 calc(var(--u) * 50) rgb(255 130 100 / 45%);
    }

    .carte.b5 { /* Bambou */
      background:
        repeating-linear-gradient(0deg, transparent 0 calc(var(--u) * 150), #2d5a1e calc(var(--u) * 150) calc(var(--u) * 158)),
        linear-gradient(90deg, #a6d46e, #5c9a32 50%, #a6d46e) 0 0 / calc(var(--u) * 40) 100%;
      --lisere: #eef8d8;
    }

    .carte.b6 { /* Tatami : paille tressée, filet vert brocart */
      background:
        repeating-linear-gradient(90deg, rgb(0 0 0 / 12%) 0 calc(var(--u) * 2), transparent calc(var(--u) * 2) calc(var(--u) * 8)),
        linear-gradient(160deg, #ddd497, #b5a95e);
      --lisere: #1f3a2a;
    }

    .carte.b7 { /* Nuages blancs sur ciel bleu */
      background:
        radial-gradient(circle at 30% 60%, #fff 0 calc(var(--u) * 18), transparent calc(var(--u) * 19)) 0 0 / calc(var(--u) * 110) calc(var(--u) * 70),
        radial-gradient(circle at 55% 45%, #fff 0 calc(var(--u) * 22), transparent calc(var(--u) * 23)) 0 0 / calc(var(--u) * 110) calc(var(--u) * 70),
        radial-gradient(circle at 80% 62%, #fff 0 calc(var(--u) * 16), transparent calc(var(--u) * 17)) 0 0 / calc(var(--u) * 110) calc(var(--u) * 70),
        linear-gradient(#7cc0ff, #3a86e0);
      --lisere: #fff;
      --halo: 0 0 calc(var(--u) * 45) rgb(120 190 255 / 40%);
    }

    .carte.b8 { /* Shōji : croisillons de bois sur papier */
      background:
        linear-gradient(90deg, #6b4423 0 calc(var(--u) * 6), transparent calc(var(--u) * 6)) 0 0 / calc(var(--u) * 36) calc(var(--u) * 36),
        linear-gradient(0deg, #6b4423 0 calc(var(--u) * 6), transparent calc(var(--u) * 6)) 0 0 / calc(var(--u) * 36) calc(var(--u) * 36),
        #f6f1e4;
      --lisere: #6b4423;
    }

    .carte.b9 { /* Damier ichimatsu noir et blanc */
      background: conic-gradient(#111 25%, #f2f2f2 0 50%, #111 0 75%, #f2f2f2 0) 0 0 / calc(var(--u) * 40) calc(var(--u) * 40);
      --lisere: #111;
    }

    .carte.b10 { /* Toxique : noir et vert acide lumineux */
      background:
        radial-gradient(circle, rgb(166 255 0 / 45%) 0 calc(var(--u) * 5), transparent calc(var(--u) * 6)) 0 0 / calc(var(--u) * 60) calc(var(--u) * 60),
        linear-gradient(160deg, #1a2a05, #070c00);
      --lisere: #a6ff00;
      box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 30) #a6ff00, 0 0 calc(var(--u) * 90) rgb(166 255 0 / 45%);
    }
    .carte.b10 .carte__cadre { box-shadow: 0 0 calc(var(--u) * 24) #a6ff00; }

    .carte.b11 { /* Lave : roche noire et coulées incandescentes */
      background:
        radial-gradient(ellipse, #ffb300 0 10%, #ff5a00 25%, transparent 50%) 0 0 / calc(var(--u) * 140) calc(var(--u) * 110),
        radial-gradient(ellipse, #ff7a00 0 12%, #c62800 30%, transparent 50%) calc(var(--u) * 70) calc(var(--u) * 55) / calc(var(--u) * 140) calc(var(--u) * 110),
        linear-gradient(#1a0a05, #2a0f05);
      --lisere: #ff8a1f;
      --halo: 0 0 calc(var(--u) * 55) rgb(255 90 0 / 45%);
    }

    .carte.b12 { /* Fumée : brume grise qui dérive */
      background:
        radial-gradient(ellipse, rgb(210 210 220 / 40%), transparent 60%) 0 0 / calc(var(--u) * 300) calc(var(--u) * 260),
        radial-gradient(ellipse, rgb(160 160 175 / 35%), transparent 60%) calc(var(--u) * 150) calc(var(--u) * 130) / calc(var(--u) * 300) calc(var(--u) * 260),
        #16161b;
      --lisere: #b9b9c4;
      animation: derive 10s linear infinite;
    }

    .carte.b13 { /* Améthyste taillée */
      background: conic-gradient(from 20deg, #3a0f6b, #9a5be0, #2a0a52, #b98cf5, #3a0f6b, #7d3fd6, #1f0845, #a77af0, #3a0f6b);
      --lisere: linear-gradient(180deg, #f2e6ff, #b98cff);
      --halo: 0 0 calc(var(--u) * 55) rgb(160 100 255 / 50%);
    }

    .carte.b14 { /* Émeraude taillée */
      background: conic-gradient(from 20deg, #0a4a2a, #2fd67f, #063a20, #5cf0a0, #0a4a2a, #1fb866, #052e19, #4fe695, #0a4a2a);
      --lisere: linear-gradient(180deg, #e3ffef, #6fe8a8);
      --halo: 0 0 calc(var(--u) * 55) rgb(40 210 120 / 45%);
    }

    .carte.b15 { /* Rubis taillé */
      background: conic-gradient(from 20deg, #6b0a1a, #e03a55, #520814, #f5607a, #6b0a1a, #c8243f, #45060f, #f04d68, #6b0a1a);
      --lisere: linear-gradient(180deg, #ffe3e8, #ff7a8f);
      --halo: 0 0 calc(var(--u) * 55) rgb(240 50 80 / 45%);
    }

    .carte.b16 { /* Pixel : gros carrés colorés, coins carrés */
      border-radius: calc(var(--u) * 10);
      background: conic-gradient(#ff4f63 25%, #ffd24f 0 50%, #4fd8ff 0 75%, #7dff8a 0) 0 0 / calc(var(--u) * 40) calc(var(--u) * 40);
      --lisere: #111;
    }
    .carte.b16 .carte__cadre { border-radius: 0; padding: calc(var(--u) * 12); }
    .carte.b16 .carte__interieur { border-radius: 0; }

    .carte.b17 { /* Pop art : trame rouge sur jaune, gros trait noir */
      background:
        radial-gradient(circle, #e53935 0 30%, transparent 32%) 0 0 / calc(var(--u) * 22) calc(var(--u) * 22),
        #ffd600;
      --lisere: #111;
    }
    .carte.b17 .carte__cadre { padding: calc(var(--u) * 14); }

    .carte.b18 { /* Encre éclaboussée : taches noires sur blanc */
      background:
        radial-gradient(circle, #111 0 calc(var(--u) * 9), transparent calc(var(--u) * 10)) calc(var(--u) * 10) calc(var(--u) * 30) / calc(var(--u) * 130) calc(var(--u) * 170),
        radial-gradient(circle, #111 0 calc(var(--u) * 5), transparent calc(var(--u) * 6)) calc(var(--u) * 60) 0 / calc(var(--u) * 90) calc(var(--u) * 110),
        radial-gradient(circle, #111 0 calc(var(--u) * 14), transparent calc(var(--u) * 15)) calc(var(--u) * 90) calc(var(--u) * 120) / calc(var(--u) * 190) calc(var(--u) * 230),
        radial-gradient(circle, #111 0 calc(var(--u) * 3), transparent calc(var(--u) * 4)) 0 calc(var(--u) * 15) / calc(var(--u) * 45) calc(var(--u) * 65),
        #f8f8f8;
      --lisere: #111;
    }

    .carte.b19 { /* Diamant : blanc glacé et étincelles qui scintillent */
      position: relative;
      background: linear-gradient(145deg, #ffffff, #dff3ff 25%, #ffffff 45%, #cfe9ff 65%, #ffffff);
      --lisere: linear-gradient(180deg, #ffffff, #bfe3ff);
      --halo: 0 0 calc(var(--u) * 60) rgb(200 235 255 / 55%);
    }
    .carte.b19::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle, #9fd8ff 0 calc(var(--u) * 4), transparent calc(var(--u) * 7)) 0 0 / calc(var(--u) * 90) calc(var(--u) * 120),
        radial-gradient(circle, #c9b8ff 0 calc(var(--u) * 3), transparent calc(var(--u) * 6)) calc(var(--u) * 45) calc(var(--u) * 60) / calc(var(--u) * 90) calc(var(--u) * 120);
      animation: scintille 2.4s ease-in-out infinite;
    }
    .carte.b19 .carte__cadre { position: relative; }

    .carte.b20 { /* Rayures pastel */
      background: repeating-linear-gradient(135deg, #ffd1e8 0 calc(var(--u) * 20), #fff3c4 calc(var(--u) * 20) calc(var(--u) * 40), #d4f8e8 calc(var(--u) * 40) calc(var(--u) * 60), #d6e9ff calc(var(--u) * 60) calc(var(--u) * 80), #e8dcff calc(var(--u) * 80) calc(var(--u) * 100));
      --lisere: #fff;
    }

    @keyframes glisse {
      to { background-position: 150% 0; }
    }

    @keyframes derive {
      to { background-position: calc(var(--u) * 300) calc(var(--u) * -260), calc(var(--u) * -150) calc(var(--u) * 390); }
    }

    @keyframes scintille {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Bordures de cartes · série 2</h1>
  <p class="aide">Aperçu temporaire : dis-moi les numéros que tu gardes.</p>
  <div class="grille"></div>

  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="rendu-carte.js"></script>
  <script>
    const PROPOSITIONS = [
      ["Bronze antique", "Bronze patiné de vert"],
      ["Or rose", "Métal rosé, filet blanc"],
      ["Aurore boréale", "Voiles verts et violets qui glissent"],
      ["Coucher de soleil", "Du jaune au violet"],
      ["Bambou", "Tiges vertes et leurs nœuds"],
      ["Tatami", "Paille tressée, filet vert"],
      ["Nuages", "Nuages blancs sur ciel bleu"],
      ["Shōji", "Croisillons de bois sur papier"],
      ["Ichimatsu", "Damier japonais noir et blanc"],
      ["Toxique", "Noir et vert acide lumineux"],
      ["Lave", "Roche noire et coulées de feu"],
      ["Fumée", "Brume grise qui dérive"],
      ["Améthyste", "Violet taillé en facettes"],
      ["Émeraude", "Vert taillé en facettes"],
      ["Rubis", "Rouge taillé en facettes"],
      ["Pixel", "Gros carrés colorés, coins carrés"],
      ["Pop art", "Trame rouge sur jaune"],
      ["Encre", "Éclaboussures noires sur blanc"],
      ["Diamant", "Blanc glacé, étincelles qui scintillent"],
      ["Pastel", "Rayures douces arc-en-ciel"],
    ];
    const illustrees = CARTES.filter(carte => carte.illustration);
    const grille = document.querySelector(".grille");
    PROPOSITIONS.forEach(([nom, description], i) => {
      const carte = creerCarte(illustrees[Math.floor((i + 0.5) * illustrees.length / PROPOSITIONS.length)]);
      carte.classList.add(`b${i + 1}`);
      const figure = element("figure");
      const legende = element("figcaption", "", `${i + 1}. ${nom}`);
      legende.append(element("small", "", description));
      figure.append(carte, legende);
      grille.append(figure);
    });
    document.fonts.ready.then(() => ajusterProprietes(grille));
  </script>
</body>
</html>
