<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nouveaux cadres, série 3 (aperçu temporaire)</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <style>
    /* Page d'aperçu temporaire : les 6 cadres qui manquent encore pour avoir 10 cadres par catégorie */
    body {
      min-height: 100vh;
      padding: 28px 16px 60px;
      background: var(--fond-eclaire, #0b0b0d) fixed;
      color: var(--texte);
      font-family: var(--police-texte);
    }

    h1 {
      margin-bottom: 6px;
      font: 400 26px / 1.1 var(--police-titre);
      text-align: center;
    }

    h2 {
      margin: 34px 0 6px;
      font: 400 22px / 1.1 var(--police-titre);
      text-align: center;
    }

    .aide,
    .sous-titre {
      margin-bottom: 20px;
      color: var(--texte-doux);
      font-size: 14px;
      text-align: center;
    }

    .grille {
      --largeur-carte: calc((min(100vw, 560px) - 52px) / 2);

      display: grid;
      grid-template-columns: repeat(2, var(--largeur-carte));
      justify-content: center;
      gap: 30px 20px;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    figcaption {
      margin-top: 12px;
      font: 400 16px / 1.15 var(--police-titre);
    }

    figcaption small {
      display: block;
      margin-top: 4px;
      color: var(--texte-faible);
      font: 700 11px / 1.3 var(--police-texte);
    }

    /* ── Outils communs ── */

    @property --angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @property --rayon {
      syntax: "<length>";
      inherits: false;
      initial-value: 0px;
    }

    .carte.calque {
      position: relative;
    }

    .carte.calque::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .carte.calque .carte__cadre {
      position: relative;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 35) var(--lueur); }
      50% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 110) var(--lueur); }
    }

    @keyframes tourne { to { --angle: 360deg; } }

    /* ══ Petite animation ══ */

    .r1 { /* Lanternes : lanternes de papier qui s'envolent doucement */
      background: linear-gradient(180deg, #0c1230, #1c1438);
      --lisere: #ffd9a0;
      --halo: 0 0 calc(var(--u) * 45) rgb(255 170 80 / 30%);
    }
    .r1::before {
      background:
        radial-gradient(ellipse calc(var(--u) * 9) calc(var(--u) * 12), #ffe7a8 0 40%, #ff9a3c 75%, rgb(255 140 50 / 35%) 100%, transparent calc(var(--u) * 20)) 0 0 / calc(var(--u) * 100) calc(var(--u) * 150),
        radial-gradient(ellipse calc(var(--u) * 6) calc(var(--u) * 8), #ffe7a8 0 40%, #ff7a2a 75%, rgb(255 120 40 / 35%) 100%, transparent calc(var(--u) * 14)) calc(var(--u) * 50) calc(var(--u) * 75) / calc(var(--u) * 100) calc(var(--u) * 150);
      animation: lanternes 14s linear infinite;
    }
    @keyframes lanternes {
      to { background-position: calc(var(--u) * 20) calc(var(--u) * -300), calc(var(--u) * 40) calc(var(--u) * -225); }
    }

    .r2 { /* Reflets d'eau : la lumière ondule comme au fond d'une piscine */
      background: linear-gradient(160deg, #1fa3b3, #0a5a6e);
      --lisere: #e6feff;
      --halo: 0 0 calc(var(--u) * 40) rgb(80 220 240 / 30%);
    }
    .r2::before {
      background:
        radial-gradient(ellipse calc(var(--u) * 30) calc(var(--u) * 10), rgb(255 255 255 / 55%), transparent 70%) 0 0 / calc(var(--u) * 90) calc(var(--u) * 60),
        radial-gradient(ellipse calc(var(--u) * 12) calc(var(--u) * 26), rgb(220 255 255 / 45%), transparent 70%) calc(var(--u) * 40) calc(var(--u) * 30) / calc(var(--u) * 80) calc(var(--u) * 90);
      animation: reflets 7s ease-in-out infinite alternate;
    }
    @keyframes reflets {
      to { background-position: calc(var(--u) * 45) calc(var(--u) * 30), calc(var(--u) * -40) calc(var(--u) * 75); }
    }

    /* ══ Animation classique ══ */

    .s1 { /* Kaléidoscope : éventail de couleurs qui tourne */
      background: repeating-conic-gradient(from var(--angle), #ff4f63 0 15deg, #ffd24f 15deg 30deg, #4fd8ff 30deg 45deg, #8a4fff 45deg 60deg);
      --lisere: #fff;
      --halo: 0 0 calc(var(--u) * 45) rgb(255 255 255 / 30%);
      animation: tourne 7s linear infinite;
    }

    .s2 { /* Ruban prisma : rayures arc-en-ciel qui défilent */
      background: repeating-linear-gradient(135deg,
        #ff7eb6 0 calc(var(--u) * 14), #ffb86b calc(var(--u) * 14) calc(var(--u) * 28),
        #fff07a calc(var(--u) * 28) calc(var(--u) * 42), #7dffc4 calc(var(--u) * 42) calc(var(--u) * 56),
        #7cc8ff calc(var(--u) * 56) calc(var(--u) * 70), #b98cff calc(var(--u) * 70) calc(var(--u) * 84));
      --lisere: #fff;
      --halo: 0 0 calc(var(--u) * 50) rgb(185 140 255 / 40%);
      animation: ruban 2.5s linear infinite;
    }
    @keyframes ruban {
      to { background-position: calc(var(--u) * 118.79) 0; }
    }

    .s3 { /* Cristal Anima : facettes noires, filet prisma, éclat qui traverse */
      background:
        linear-gradient(115deg, transparent 38%, rgb(255 255 255 / 55%) 48%, rgb(185 140 255 / 40%) 52%, transparent 62%) 0 0 / 250% 100%,
        linear-gradient(60deg, transparent 49%, rgb(255 255 255 / 14%) 50%, transparent 51%) 0 0 / calc(var(--u) * 90) calc(var(--u) * 78),
        linear-gradient(-60deg, transparent 49%, rgb(255 255 255 / 14%) 50%, transparent 51%) 0 0 / calc(var(--u) * 90) calc(var(--u) * 78),
        linear-gradient(0deg, transparent 49%, rgb(255 255 255 / 10%) 50%, transparent 51%) 0 0 / calc(var(--u) * 90) calc(var(--u) * 78),
        conic-gradient(from 30deg at 30% 25%, #1b1b21 0 25%, #121216 0 50%, #202027 0 75%, #0e0e11 0);
      --lisere: var(--prisma-diagonal);
      --halo: 0 0 calc(var(--u) * 50) rgb(185 140 255 / 35%);
      animation: cristal 3.2s ease-in-out infinite;
    }
    @keyframes cristal {
      0% { background-position: 150% 0, 0 0, 0 0, 0 0, 0 0; }
      65%, 100% { background-position: -150% 0, 0 0, 0 0, 0 0, 0 0; }
    }

    /* ══ Grosse animation ══ */

    .t1 { /* Hyperespace : traînées d'étoiles qui jaillissent du centre à toute vitesse */
      background:
        repeating-radial-gradient(circle at 50% 50%, transparent calc(var(--rayon)), rgb(200 225 255 / 90%) calc(var(--rayon) + var(--u) * 3), transparent calc(var(--rayon) + var(--u) * 8), transparent calc(var(--rayon) + var(--u) * 26)),
        repeating-conic-gradient(from 0deg, rgb(255 255 255 / 85%) 0 0.8deg, transparent 0.8deg 7deg),
        radial-gradient(circle, #2a3a8a, #02030f 70%);
      --lisere: #cfe4ff;
      --lueur: rgb(140 180 255 / 85%);
      animation: hyperespace 0.4s linear infinite, pulse 0.8s ease-in-out infinite;
    }
    @keyframes hyperespace {
      to { --rayon: calc(var(--u) * 26); }
    }
  </style>
</head>
<body>
  <h1>Nouveaux cadres · série 3</h1>
  <p class="aide">Aperçu temporaire : les derniers cadres pour avoir 10 cadres par catégorie. Dis-moi les codes que tu gardes.</p>
  <div data-categories></div>

  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="rendu-carte.js"></script>
  <script>
    // [classe, nom, description, calque d'effets ?]
    const CATEGORIES = [
      ["Petite animation", "2 manquants", [
        ["r1", "Lanternes", "Lanternes de papier qui s'envolent doucement", true],
        ["r2", "Reflets d'eau", "La lumière ondule comme au fond d'une piscine", true],
      ]],
      ["Animation classique", "3 manquants", [
        ["s1", "Kaléidoscope", "Éventail de couleurs qui tourne"],
        ["s2", "Ruban prisma", "Rayures arc-en-ciel qui défilent"],
        ["s3", "Cristal Anima", "Facettes noires, filet prisma, éclat qui traverse"],
      ]],
      ["Grosse animation", "1 manquant", [
        ["t1", "Hyperespace", "Traînées d'étoiles qui jaillissent du centre"],
      ]],
    ];
    const illustrees = CARTES.filter(carte => carte.illustration && carte.rang < 5);
    let rang = 0;
    const zone = document.querySelector("[data-categories]");
    for (const [titre, manquants, cadres] of CATEGORIES) {
      const grille = element("div", "grille");
      for (const [classe, nom, description, calque] of cadres) {
        const carte = creerCarte(illustrees[(rang++ * 13 + 5) % illustrees.length]);
        carte.classList.add(classe);
        if (calque) carte.classList.add("calque");
        const figure = element("figure");
        const legende = element("figcaption", "", `${classe.toUpperCase()}. ${nom}`);
        legende.append(element("small", "", description));
        figure.append(carte, legende);
        grille.append(figure);
      }
      zone.append(element("h2", "", titre), element("p", "sous-titre", manquants), grille);
    }
    document.fonts.ready.then(() => ajusterProprietes(zone));
  </script>
</body>
</html>
