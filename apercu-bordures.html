<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bordures de cartes (aperçu temporaire)</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <style>
    /* Page d'aperçu temporaire : 20 bordures de cartes à acheter, chacune posée sur une carte du jeu */
    body {
      min-height: 100vh;
      padding: 28px 16px 60px;
      background: var(--fond-eclaire, #0b0b0d) fixed;
      color: var(--texte);
      font-family: var(--police-texte);
    }

    h1 {
      margin-bottom: 6px;
      font: 400 26px / 1.1 var(--police-titre);
      text-align: center;
    }

    .aide {
      margin-bottom: 24px;
      color: var(--texte-doux);
      font-size: 14px;
      text-align: center;
    }

    .grille {
      --largeur-carte: calc((min(100vw, 560px) - 52px) / 2);

      display: grid;
      grid-template-columns: repeat(2, var(--largeur-carte));
      justify-content: center;
      gap: 30px 20px;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    figcaption {
      margin-top: 12px;
      font: 400 16px / 1.15 var(--police-titre);
    }

    figcaption small {
      display: block;
      margin-top: 4px;
      color: var(--texte-faible);
      font: 700 11px / 1.3 var(--police-texte);
    }

    /* ── Les bordures : le fond de .carte fait le cadre extérieur, --lisere le filet intérieur ── */

    .carte.b1 { /* Or royal */
      background: linear-gradient(145deg, #fff2b0, #d4a22c 28%, #8a5a0c 52%, #f5d77a 74%, #a8761a);
      --lisere: linear-gradient(180deg, #fff6c8, #b8861e);
      --halo: 0 0 calc(var(--u) * 50) rgb(240 190 80 / 45%);
    }

    .carte.b2 { /* Argent poli */
      background: linear-gradient(145deg, #ffffff, #b9bcc6 25%, #6e717c 50%, #e4e6ec 75%, #8d909a);
      --lisere: #f4f5f8;
      --halo: 0 0 calc(var(--u) * 40) rgb(220 225 235 / 35%);
    }

    .carte.b3 { /* Nacre */
      background: linear-gradient(145deg, #ffffff, #efe8fb 28%, #e2f5f7 52%, #fdeef3 76%, #ffffff);
      --lisere: linear-gradient(135deg, #ffd9ea, #fff6c9, #d5fbe9, #d6ecff, #eadcff);
      --halo: 0 0 calc(var(--u) * 50) rgb(255 255 255 / 40%);
    }

    .carte.b4 { /* Prisma vivant : l'arc-en-ciel tourne autour de la carte */
      background: linear-gradient(120deg, #ff7eb6, #ffb86b, #fff07a, #7dffc4, #7cc8ff, #b98cff, #ff7eb6) 0 0 / 300% 300%;
      --lisere: #fff;
      --halo: 0 0 calc(var(--u) * 60) rgb(185 140 255 / 50%);
      animation: defile-bordure 6s linear infinite;
    }

    .carte.b5 { /* Holographique : argent et éclat irisé qui passe */
      background:
        linear-gradient(115deg, transparent 30%, rgb(255 255 255 / 85%) 44%, rgb(124 200 255 / 55%) 50%, rgb(255 126 182 / 55%) 56%, transparent 70%) 0 0 / 250% 100%,
        linear-gradient(145deg, #e8e8ee, #a9a9b6 50%, #f2f2f6);
      --lisere: linear-gradient(135deg, #ffffff, #c9ccd6);
      --halo: 0 0 calc(var(--u) * 45) rgb(200 220 255 / 40%);
      animation: eclat-bordure 3.5s ease-in-out infinite;
    }

    .carte.b6 { /* Néon cyan */
      background: #07070b;
      --lisere: #3ff0ff;
      box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 30) #3ff0ff, 0 0 calc(var(--u) * 90) rgb(63 240 255 / 55%);
    }
    .carte.b6 .carte__cadre { box-shadow: 0 0 calc(var(--u) * 24) #3ff0ff; }

    .carte.b7 { /* Néon rose */
      background: #0b0710;
      --lisere: #ff4fd8;
      box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 30) #ff4fd8, 0 0 calc(var(--u) * 90) rgb(255 79 216 / 55%);
    }
    .carte.b7 .carte__cadre { box-shadow: 0 0 calc(var(--u) * 24) #ff4fd8; }

    .carte.b8 { /* Sakura : pétales sur fond rose */
      background:
        radial-gradient(circle, #fff3f7 0 calc(var(--u) * 9), transparent calc(var(--u) * 10)) 0 0 / calc(var(--u) * 90) calc(var(--u) * 90),
        radial-gradient(circle, #ffd6e4 0 calc(var(--u) * 6), transparent calc(var(--u) * 7)) calc(var(--u) * 45) calc(var(--u) * 45) / calc(var(--u) * 90) calc(var(--u) * 90),
        linear-gradient(160deg, #ffb7cf, #e5739f);
      --lisere: #fff;
      --halo: 0 0 calc(var(--u) * 50) rgb(255 160 195 / 45%);
    }

    .carte.b9 { /* Washi : papier japonais et filet d'encre */
      background:
        repeating-linear-gradient(80deg, rgb(120 100 70 / 6%) 0 calc(var(--u) * 3), transparent calc(var(--u) * 3) calc(var(--u) * 17)),
        linear-gradient(160deg, #f7f2e6, #e6dcc6);
      --lisere: #141414;
    }

    .carte.b10 { /* Trame manga : points noirs sur blanc */
      background:
        radial-gradient(circle, #111 0 32%, transparent 34%) 0 0 / calc(var(--u) * 26) calc(var(--u) * 26),
        #fff;
      --lisere: #111;
    }

    .carte.b11 { /* Flammes : dégradé de feu qui ondule */
      background: linear-gradient(0deg, #ffe066, #ff8a1f 25%, #d4241c 50%, #ff8a1f 75%, #ffe066) 0 0 / 100% 200%;
      --lisere: #ffd35a;
      --halo: 0 0 calc(var(--u) * 60) rgb(255 110 30 / 55%);
      animation: monte-bordure 2.5s linear infinite;
    }

    .carte.b12 { /* Océan : vagues seigaiha bleues */
      background:
        radial-gradient(circle at 50% 100%, #0d3a70 0 calc(var(--u) * 12), #4f9bdc calc(var(--u) * 12) calc(var(--u) * 16), #1b5fa8 calc(var(--u) * 16) calc(var(--u) * 28), #4f9bdc calc(var(--u) * 28) calc(var(--u) * 32), #0d3a70 calc(var(--u) * 32) calc(var(--u) * 40), transparent calc(var(--u) * 40)) 0 0 / calc(var(--u) * 80) calc(var(--u) * 40),
        radial-gradient(circle at 50% 100%, #0d3a70 0 calc(var(--u) * 12), #4f9bdc calc(var(--u) * 12) calc(var(--u) * 16), #1b5fa8 calc(var(--u) * 16) calc(var(--u) * 28), #4f9bdc calc(var(--u) * 28) calc(var(--u) * 32), #0d3a70 calc(var(--u) * 32) calc(var(--u) * 40), transparent calc(var(--u) * 40)) calc(var(--u) * 40) calc(var(--u) * 20) / calc(var(--u) * 80) calc(var(--u) * 40),
        #0d3a70;
      --lisere: #cfe8ff;
      --halo: 0 0 calc(var(--u) * 45) rgb(80 160 230 / 40%);
    }

    .carte.b13 { /* Éclair : violet orageux, filet jaune et noir */
      background: linear-gradient(160deg, #2b1656, #120a28);
      --lisere: repeating-linear-gradient(135deg, #ffe14d 0 calc(var(--u) * 14), #1a0f38 calc(var(--u) * 14) calc(var(--u) * 28));
      --halo: 0 0 calc(var(--u) * 55) rgb(255 225 77 / 45%);
    }
    .carte.b13 .carte__cadre { padding: calc(var(--u) * 14); }

    .carte.b14 { /* Glace */
      background: linear-gradient(160deg, #f2fbff, #bfe6f7 35%, #8cc9e6 62%, #e6f7ff);
      --lisere: #fff;
      --halo: 0 0 calc(var(--u) * 55) rgb(160 225 255 / 50%);
    }

    .carte.b15 { /* Jade veiné d'or */
      background:
        radial-gradient(ellipse at 25% 15%, rgb(255 255 255 / 28%), transparent 40%),
        radial-gradient(ellipse at 75% 85%, #0b5a3c, transparent 55%),
        linear-gradient(150deg, #3fbf8a, #14805a 50%, #0a4a33);
      --lisere: linear-gradient(180deg, #f7e7a8, #b8901e);
      --halo: 0 0 calc(var(--u) * 45) rgb(60 190 130 / 40%);
    }

    .carte.b16 { /* Laque rouge et or */
      background: linear-gradient(160deg, #c21a24, #6e0910);
      --lisere: linear-gradient(180deg, #ffe7a0, #c08a1e);
      box-shadow: inset 0 0 0 calc(var(--u) * 14) #8e0f17, inset 0 0 0 calc(var(--u) * 19) #e0b44a, 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 45) rgb(220 40 40 / 40%);
    }

    .carte.b17 { /* Saphir taillé */
      background: conic-gradient(from 20deg, #0d2a6b, #3f7fe0, #0a1f52, #5c9bf5, #0d2a6b, #2f6fd6, #081a45, #4f8ff0, #0d2a6b);
      --lisere: linear-gradient(180deg, #e3f0ff, #7fb3ff);
      --halo: 0 0 calc(var(--u) * 55) rgb(80 140 255 / 50%);
    }

    .carte.b18 { /* Galaxie : poussière d'étoiles sur fond violet nuit */
      background:
        radial-gradient(circle, #fff 0 calc(var(--u) * 3), transparent calc(var(--u) * 4)) 0 0 / calc(var(--u) * 70) calc(var(--u) * 70),
        radial-gradient(circle, rgb(255 255 255 / 70%) 0 calc(var(--u) * 2), transparent calc(var(--u) * 3)) calc(var(--u) * 33) calc(var(--u) * 21) / calc(var(--u) * 55) calc(var(--u) * 55),
        radial-gradient(ellipse at 30% 30%, rgb(185 140 255 / 55%), transparent 55%),
        radial-gradient(ellipse at 75% 75%, rgb(124 200 255 / 40%), transparent 55%),
        #0c0820;
      --lisere: linear-gradient(135deg, #b98cff, #7cc8ff);
      --halo: 0 0 calc(var(--u) * 55) rgb(150 110 255 / 45%);
    }

    .carte.b19 { /* Carbone */
      background:
        radial-gradient(#000 15%, transparent 16%) 0 0 / calc(var(--u) * 40) calc(var(--u) * 40),
        radial-gradient(#000 15%, transparent 16%) calc(var(--u) * 20) calc(var(--u) * 20) / calc(var(--u) * 40) calc(var(--u) * 40),
        radial-gradient(rgb(255 255 255 / 10%) 15%, transparent 20%) 0 calc(var(--u) * 2) / calc(var(--u) * 40) calc(var(--u) * 40),
        radial-gradient(rgb(255 255 255 / 10%) 15%, transparent 20%) calc(var(--u) * 20) calc(var(--u) * 22) / calc(var(--u) * 40) calc(var(--u) * 40),
        #282828;
      --lisere: #c8102e;
      --halo: 0 0 calc(var(--u) * 40) rgb(200 16 46 / 35%);
    }

    .carte.b20 { /* 魂 : notre symbole en motif sur fond noir */
      position: relative;
      background: #0b0b0d;
      --lisere: var(--prisma-diagonal);
      --halo: 0 0 calc(var(--u) * 50) rgb(185 140 255 / 40%);
    }
    .carte.b20::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: url("assets/logo/anima-symbole.svg") 0 0 / calc(var(--u) * 80) calc(var(--u) * 80);
      opacity: 0.35;
    }
    .carte.b20 .carte__cadre { position: relative; }

    @keyframes defile-bordure {
      to { background-position: 300% 300%; }
    }

    @keyframes eclat-bordure {
      0% { background-position: 150% 0, 0 0; }
      60%, 100% { background-position: -150% 0, 0 0; }
    }

    @keyframes monte-bordure {
      to { background-position: 0 -200%; }
    }
  </style>
</head>
<body>
  <h1>Bordures de cartes</h1>
  <p class="aide">Aperçu temporaire : dis-moi les numéros que tu gardes.</p>
  <div class="grille"></div>

  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="rendu-carte.js"></script>
  <script>
    const BORDURES = [
      ["Or royal", "Cadre doré, reflets chauds"],
      ["Argent poli", "Métal brossé, filet blanc"],
      ["Nacre", "Blanc nacré, filet pastel irisé"],
      ["Prisma vivant", "L'arc-en-ciel défile autour"],
      ["Holographique", "Argent, éclat irisé qui passe"],
      ["Néon cyan", "Cadre noir, lueur cyan"],
      ["Néon rose", "Cadre noir, lueur rose"],
      ["Sakura", "Rose, pétales de cerisier"],
      ["Washi", "Papier japonais, filet d'encre"],
      ["Trame manga", "Points noirs sur blanc"],
      ["Flammes", "Feu qui ondule vers le haut"],
      ["Océan", "Vagues japonaises bleues"],
      ["Éclair", "Violet orage, filet jaune et noir"],
      ["Glace", "Bleu givré, halo froid"],
      ["Jade", "Pierre verte, filet d'or"],
      ["Laque", "Rouge laqué, double filet d'or"],
      ["Saphir", "Bleu taillé en facettes"],
      ["Galaxie", "Étoiles sur violet nuit"],
      ["Carbone", "Fibre de carbone, filet rouge"],
      ["Âme", "Motif 魂 sur noir, filet prisma"],
    ];
    const illustrees = CARTES.filter(carte => carte.illustration);
    const grille = document.querySelector(".grille");
    BORDURES.forEach(([nom, description], i) => {
      const carte = creerCarte(illustrees[Math.floor(i * illustrees.length / BORDURES.length)]);
      carte.classList.add(`b${i + 1}`);
      const figure = element("figure");
      const legende = element("figcaption", "", `${i + 1}. ${nom}`);
      legende.append(element("small", "", description));
      figure.append(carte, legende);
      grille.append(figure);
    });
    document.fonts.ready.then(() => ajusterProprietes(grille));
  </script>
</body>
</html>
