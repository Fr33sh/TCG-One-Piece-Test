<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nouveaux cadres, série 4 (aperçu temporaire)</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="carte.css">
  <style>
    /* Page d'aperçu temporaire : les derniers choix pour avoir 10 cadres par catégorie */
    body {
      min-height: 100vh;
      padding: 28px 16px 60px;
      background: var(--fond-eclaire, #0b0b0d) fixed;
      color: var(--texte);
      font-family: var(--police-texte);
    }

    h1 {
      margin-bottom: 6px;
      font: 400 26px / 1.1 var(--police-titre);
      text-align: center;
    }

    h2 {
      margin: 34px 0 6px;
      font: 400 22px / 1.1 var(--police-titre);
      text-align: center;
    }

    .aide,
    .sous-titre {
      margin-bottom: 20px;
      color: var(--texte-doux);
      font-size: 14px;
      text-align: center;
    }

    .grille {
      --largeur-carte: calc((min(100vw, 560px) - 52px) / 2);

      display: grid;
      grid-template-columns: repeat(2, var(--largeur-carte));
      justify-content: center;
      gap: 30px 20px;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    figcaption {
      margin-top: 12px;
      font: 400 16px / 1.15 var(--police-titre);
    }

    figcaption small {
      display: block;
      margin-top: 4px;
      color: var(--texte-faible);
      font: 700 11px / 1.3 var(--police-texte);
    }

    /* ── Outils communs ── */

    @property --angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @property --rayon {
      syntax: "<length>";
      inherits: false;
      initial-value: 0px;
    }

    .carte.calque {
      position: relative;
    }

    .carte.calque::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .carte.calque .carte__cadre {
      position: relative;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 35) var(--lueur); }
      50% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 110) var(--lueur); }
    }

    @keyframes tourne { to { --angle: 360deg; } }

    /* ══ Petite animation (1 place) ══ */

    .u1 { /* Plumes : plumes blanches qui descendent en planant */
      background: linear-gradient(180deg, #8fc8ff, #4a8ad8);
      --lisere: #fff;
      --halo: 0 0 calc(var(--u) * 40) rgb(150 200 255 / 35%);
    }
    .u1::before {
      background:
        radial-gradient(ellipse calc(var(--u) * 4) calc(var(--u) * 16), #fff 70%, transparent) 0 0 / calc(var(--u) * 90) calc(var(--u) * 140),
        radial-gradient(ellipse calc(var(--u) * 3) calc(var(--u) * 11), rgb(255 255 255 / 85%) 70%, transparent) calc(var(--u) * 45) calc(var(--u) * 70) / calc(var(--u) * 90) calc(var(--u) * 140);
      animation: plumes 12s ease-in-out infinite;
    }
    @keyframes plumes {
      0% { background-position: 0 0, calc(var(--u) * 45) calc(var(--u) * 70); }
      50% { background-position: calc(var(--u) * 30) calc(var(--u) * 140), calc(var(--u) * 15) calc(var(--u) * 210); }
      100% { background-position: 0 calc(var(--u) * 280), calc(var(--u) * 45) calc(var(--u) * 350); }
    }

    .u2 { /* Souffle prisma : cadre noir, la lueur passe lentement d'une couleur à l'autre */
      background: #0b0b0d;
      --lisere: var(--prisma-diagonal);
      animation: souffle 8s ease-in-out infinite;
    }
    @keyframes souffle {
      0%, 100% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 50) rgb(255 126 182 / 55%); }
      25% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 70) rgb(255 240 122 / 55%); }
      50% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 50) rgb(125 255 196 / 55%); }
      75% { box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgb(0 0 0 / 45%), 0 0 calc(var(--u) * 70) rgb(124 200 255 / 55%); }
    }

    .u3 { /* Pissenlit : petites graines blanches emportées par le vent */
      background: linear-gradient(160deg, #6aa84a, #2f5e22);
      --lisere: #f4ffe8;
    }
    .u3::before {
      background:
        radial-gradient(circle, #fff 0 calc(var(--u) * 2), rgb(255 255 255 / 45%) calc(var(--u) * 3), transparent calc(var(--u) * 8)) 0 0 / calc(var(--u) * 80) calc(var(--u) * 90),
        radial-gradient(circle, rgb(255 255 255 / 85%) 0 calc(var(--u) * 1.5), transparent calc(var(--u) * 6)) calc(var(--u) * 40) calc(var(--u) * 45) / calc(var(--u) * 80) calc(var(--u) * 90);
      animation: pissenlit 9s linear infinite;
    }
    @keyframes pissenlit {
      to { background-position: calc(var(--u) * 160) calc(var(--u) * -90), calc(var(--u) * 200) calc(var(--u) * -45); }
    }

    /* ══ Animation classique (2 places) ══ */

    .v1 { /* Arc-en-ciel liquide : les couleurs du prisma coulent vers le haut */
      background: linear-gradient(0deg, #ff7eb6, #ffb86b, #fff07a, #7dffc4, #7cc8ff, #b98cff, #ff7eb6) 0 0 / 100% 200%;
      --lisere: #fff;
      --halo: 0 0 calc(var(--u) * 50) rgb(185 140 255 / 40%);
      animation: liquide 4s linear infinite;
    }
    @keyframes liquide {
      to { background-position: 0 -200%; }
    }

    .v2 { /* Spirale hypnotique : noir et blanc qui tourne */
      background: repeating-conic-gradient(from var(--angle), #0b0b0d 0 12deg, #f4f4f6 12deg 24deg);
      --lisere: #ff4f63;
      --halo: 0 0 calc(var(--u) * 40) rgb(255 79 99 / 30%);
      animation: tourne 6s linear infinite;
    }

    .v3 { /* Circuit : pistes cyan où courent des impulsions de lumière */
      background:
        linear-gradient(90deg, transparent 0 40%, #7cf6ff 48%, transparent 56%) 0 0 / calc(var(--u) * 160) calc(var(--u) * 40),
        linear-gradient(90deg, rgb(63 240 255 / 35%) 0 calc(var(--u) * 3), transparent calc(var(--u) * 3)) 0 0 / calc(var(--u) * 40) calc(var(--u) * 40),
        linear-gradient(0deg, rgb(63 240 255 / 35%) 0 calc(var(--u) * 3), transparent calc(var(--u) * 3)) 0 0 / calc(var(--u) * 40) calc(var(--u) * 40),
        #041218;
      --lisere: #3ff0ff;
      --halo: 0 0 calc(var(--u) * 45) rgb(63 240 255 / 35%);
      animation: circuit 1.8s linear infinite;
    }
    @keyframes circuit {
      to { background-position: calc(var(--u) * 160) 0, 0 0, 0 0, 0 0; }
    }

    .v4 { /* Damas doré : motif d'or sur noir, reflet qui passe */
      background:
        linear-gradient(115deg, transparent 38%, rgb(255 240 190 / 60%) 48%, transparent 58%) 0 0 / 250% 100%,
        radial-gradient(circle at 50% 50%, transparent calc(var(--u) * 10), #c8962c calc(var(--u) * 11) calc(var(--u) * 13), transparent calc(var(--u) * 14)) 0 0 / calc(var(--u) * 50) calc(var(--u) * 50),
        radial-gradient(circle at 50% 50%, #e8c060 0 calc(var(--u) * 4), transparent calc(var(--u) * 5)) calc(var(--u) * 25) calc(var(--u) * 25) / calc(var(--u) * 50) calc(var(--u) * 50),
        #0d0b08;
      --lisere: linear-gradient(180deg, #fbe39a, #b8861e);
      --halo: 0 0 calc(var(--u) * 45) rgb(224 180 74 / 35%);
      animation: damas 3.5s ease-in-out infinite;
    }
    @keyframes damas {
      0% { background-position: 150% 0, 0 0, calc(var(--u) * 25) calc(var(--u) * 25), 0 0; }
      65%, 100% { background-position: -150% 0, 0 0, calc(var(--u) * 25) calc(var(--u) * 25), 0 0; }
    }
  </style>
</head>
<body>
  <h1>Nouveaux cadres · série 4</h1>
  <p class="aide">Aperçu temporaire : les dernières places pour avoir 10 cadres par catégorie. Dis-moi les codes que tu gardes.</p>
  <div data-categories></div>

  <script src="donnees/cartes-east-blue.js"></script>
  <script src="donnees/cartes-naruto.js"></script>
  <script src="donnees/cartes-bleach.js"></script>
  <script src="donnees/series.js"></script>
  <script src="rendu-carte.js"></script>
  <script>
    // [classe, nom, description, calque d'effets ?]
    const CATEGORIES = [
      ["Petite animation", "1 place : 3 choix", [
        ["u1", "Plumes", "Plumes blanches qui descendent en planant", true],
        ["u2", "Souffle prisma", "La lueur passe lentement d'une couleur à l'autre"],
        ["u3", "Pissenlit", "Petites graines emportées par le vent", true],
      ]],
      ["Animation classique", "2 places : 4 choix", [
        ["v1", "Arc-en-ciel liquide", "Les couleurs du prisma coulent vers le haut"],
        ["v2", "Spirale hypnotique", "Noir et blanc qui tourne"],
        ["v3", "Circuit", "Pistes cyan où courent des impulsions de lumière"],
        ["v4", "Damas doré", "Motif d'or sur noir, reflet qui passe"],
      ]],
    ];
    const illustrees = CARTES.filter(carte => carte.illustration && carte.rang < 5);
    let rang = 0;
    const zone = document.querySelector("[data-categories]");
    for (const [titre, manquants, cadres] of CATEGORIES) {
      const grille = element("div", "grille");
      for (const [classe, nom, description, calque] of cadres) {
        const carte = creerCarte(illustrees[(rang++ * 13 + 5) % illustrees.length]);
        carte.classList.add(classe);
        if (calque) carte.classList.add("calque");
        const figure = element("figure");
        const legende = element("figcaption", "", `${classe.toUpperCase()}. ${nom}`);
        legende.append(element("small", "", description));
        figure.append(carte, legende);
        grille.append(figure);
      }
      zone.append(element("h2", "", titre), element("p", "sous-titre", manquants), grille);
    }
    document.fonts.ready.then(() => ajusterProprietes(zone));
  </script>
</body>
</html>
